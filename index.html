<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TAPE — mechanics test</title>
<style>
:root{--bg:#0f1623;--text:#eef3fb;--muted:#9aa6b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center}
#app{width:min(100vw,620px);height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.brand{font-size:14px;font-weight:800;letter-spacing:.18em}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
button{border:0;border-radius:14px;background:#1d293b;color:#f4f7fb;padding:10px 14px;font:inherit;font-weight:700}
#viewport{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:20px;touch-action:none;background:var(--bg)}
#world{position:absolute;left:0;top:0;width:1000px;height:1300px;transform-origin:0 0}
.tape{position:absolute;transform-origin:left center;border-radius:4px;pointer-events:none;
box-shadow:0 4px 9px rgba(0,0,0,.28),inset 0 1px 0 rgba(255,255,255,.18)}
.tape:after{content:"";position:absolute;inset:0;opacity:.7;
background:linear-gradient(180deg,rgba(255,255,255,.15),transparent 48%,rgba(0,0,0,.08)),
repeating-linear-gradient(90deg,transparent 0 15px,rgba(255,255,255,.07) 16px 17px,transparent 18px 31px)}
.patch{position:absolute;transform-origin:left center;border-radius:4px;pointer-events:none;z-index:5000;
box-shadow:0 3px 7px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.2)}
.roll{position:absolute;width:42px;height:28px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;
z-index:9000;opacity:0;box-shadow:inset -9px 0 12px rgba(0,0,0,.34),0 5px 10px rgba(0,0,0,.3)}
#hud{position:absolute;left:12px;top:12px;z-index:9500;background:rgba(18,26,40,.78);backdrop-filter:blur(8px);
padding:8px 10px;border-radius:12px;font-size:12px;color:#d7deea}
footer{height:74px;display:flex;align-items:center;justify-content:space-between;padding:4px 2px 0;gap:10px}
#status{font-size:13px;line-height:1.35;color:#aeb8c7}
#status b{color:#fff}
</style>
</head>
<body>
<div id="app">
<header>
  <div><div class="brand">TAPE · MECHANICS TEST</div><div class="sub">fixed contacts only · no diagonals</div></div>
  <button id="resetBtn">Reset</button>
</header>
<div id="viewport">
  <div id="world"></div>
  <div id="hud">tap a visible free-end segment · pinch to zoom · drag to pan</div>
</div>
<footer>
  <div id="status"><b>Testing physics only.</b><br>Every contact is fixed at load.</div>
  <button id="undoBtn">Undo</button>
</footer>
</div>

<script>
(()=>{
const viewport=document.getElementById('viewport'),world=document.getElementById('world'),
status=document.getElementById('status'),resetBtn=document.getElementById('resetBtn'),undoBtn=document.getElementById('undoBtn');

const WW=1000,WH=1300;
const COLORS=['#ef5b5b','#f0bb43','#4b9fe0','#5fbe84','#9b73d5','#e784b7','#ef8a4c','#54c4bc'];
let strips=[],contacts=[],history=[],animating=false,animVisual=null;
let view={scale:.55,tx:0,ty:0},pointers=new Map(),gesture=null,tapCandidate=null;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hypot=Math.hypot;

function applyView(){world.style.transform=`translate(${view.tx}px,${view.ty}px) scale(${view.scale})`}
function fitWorld(){const vw=viewport.clientWidth,vh=viewport.clientHeight,s=Math.min(vw/WW,vh/WH)*.96;
view.scale=s;view.tx=(vw-WW*s)/2;view.ty=(vh-WH*s)/2;applyView()}
function screenToWorld(x,y){const r=viewport.getBoundingClientRect();return{x:(x-r.left-view.tx)/view.scale,y:(y-r.top-view.ty)/view.scale}}

function addStrip(id,ax,ay,bx,by,width,color){
  strips.push({id,ax,ay,bx,by,width,color,a:0,b:1,removed:false,el:null,roll:null});
}
function pointOn(s,t){return{x:s.ax+(s.bx-s.ax)*t,y:s.ay+(s.by-s.ay)*t}}
function geom(s){const dx=s.bx-s.ax,dy=s.by-s.ay,L=hypot(dx,dy);return{x1:s.ax,y1:s.ay,x2:s.bx,y2:s.by,dx,dy,L,ux:dx/L,uy:dy/L}}

function buildFixedBoard(){
  strips=[];contacts=[];history=[];animating=false;animVisual=null;world.innerHTML='';

  // Hand-authored orthogonal tapes so every relationship is inspectable.
  // Wide strips, substantial overlaps only.
  addStrip(0,120,230,880,230,64,COLORS[0]); // red H
  addStrip(1,250,120,250,1180,64,COLORS[1]); // yellow V
  addStrip(2,120,410,880,410,64,COLORS[2]); // blue H
  addStrip(3,470,120,470,1180,64,COLORS[3]); // green V
  addStrip(4,120,590,880,590,64,COLORS[4]); // purple H
  addStrip(5,690,120,690,1180,64,COLORS[5]); // pink V
  addStrip(6,120,770,880,770,64,COLORS[6]); // orange H
  addStrip(7,820,120,820,1180,64,COLORS[7]); // teal V
  addStrip(8,120,950,880,950,64,COLORS[1]); // yellow H
  addStrip(9,360,120,360,1180,64,COLORS[2]); // blue V

  // Fixed LOCAL contacts: upper/lower defined once, immutable.
  // The spans are exact based on full 64px cross-over.
  const halfSpanH = 32/760;
  const halfSpanV = 32/1060;

  function addCross(hid,vid,upper){
    const h=strips[hid],v=strips[vid];
    const hx=(v.ax-h.ax)/(h.bx-h.ax), vy=(h.ay-v.ay)/(v.by-v.ay);
    contacts.push({
      upper,
      lower: upper===hid?vid:hid,
      upperSpan: upper===hid?[hx-halfSpanH,hx+halfSpanH]:[vy-halfSpanV,vy+halfSpanV],
      lowerSpan: upper===hid?[vy-halfSpanV,vy+halfSpanV]:[hx-halfSpanH,hx+halfSpanH],
      hid,vid
    });
  }

  // Alternate local hierarchy to force genuine partial peels.
  addCross(0,1,0); addCross(0,3,3); addCross(0,5,0); addCross(0,7,7); addCross(0,9,9);
  addCross(2,1,1); addCross(2,3,2); addCross(2,5,5); addCross(2,7,2); addCross(2,9,9);
  addCross(4,1,4); addCross(4,3,3); addCross(4,5,4); addCross(4,7,7); addCross(4,9,4);
  addCross(6,1,1); addCross(6,3,6); addCross(6,5,5); addCross(6,7,6); addCross(6,9,9);
  addCross(8,1,8); addCross(8,3,3); addCross(8,5,8); addCross(8,7,7); addCross(8,9,8);

  createVisuals();fitWorld();render();
}

function createVisuals(){
  for(const s of strips){
    const el=document.createElement('div');el.className='tape';el.style.background=s.color;el.style.zIndex=100;world.appendChild(el);s.el=el;
    const roll=document.createElement('div');roll.className='roll';
    roll.style.background=`radial-gradient(circle at 36% 50%,rgba(255,255,255,.5) 0 12%,${s.color} 20% 58%,rgba(20,20,20,.32) 60% 69%,${s.color} 71%)`;
    world.appendChild(roll);s.roll=roll;
  }
}
function overlap1(a,b){return Math.max(0,Math.min(a[1],b[1])-Math.max(a[0],b[0]))}
function activeContact(c){
  const up=strips[c.upper];
  return !up.removed && overlap1([up.a,up.b],c.upperSpan)>1e-6;
}
function zonesFor(id){
  return contacts.filter(c=>c.lower===id&&activeContact(c)).map(c=>c.lowerSpan.slice()).sort((a,b)=>a[0]-b[0]);
}
function mergeZones(zs){
  const out=[];
  for(const z of zs){
    if(!out.length||z[0]>out[out.length-1][1]+1e-6)out.push(z.slice());
    else out[out.length-1][1]=Math.max(out[out.length-1][1],z[1]);
  }
  return out;
}
function freeAccess(s,t){
  const zs=mergeZones(zonesFor(s.id).filter(z=>overlap1(z,[s.a,s.b])>1e-6)
    .map(z=>[Math.max(z[0],s.a),Math.min(z[1],s.b)]));

  // Actual remaining left/right ends are always free unless they themselves
  // are physically under an active contact.
  const leftBlocked=zs.some(z=>s.a>=z[0]-1e-6&&s.a<=z[1]+1e-6);
  const rightBlocked=zs.some(z=>s.b>=z[0]-1e-6&&s.b<=z[1]+1e-6);

  let leftStop=s.b,rightStop=s.a;
  if(!leftBlocked){
    const z=zs.find(z=>z[0]>s.a+1e-6);
    leftStop=z?z[0]:s.b;
  }
  if(!rightBlocked){
    for(let i=zs.length-1;i>=0;i--){
      if(zs[i][1]<s.b-1e-6){rightStop=zs[i][1];break}
    }
  }

  const inLeft=!leftBlocked && t>=s.a-1e-6 && t<=leftStop+1e-6;
  const inRight=!rightBlocked && t>=rightStop-1e-6 && t<=s.b+1e-6;

  if(!inLeft&&!inRight)return null;

  if(inLeft&&inRight){
    const dl=t-s.a,dr=s.b-t;
    return dl<=dr
      ? {side:'left',from:s.a,to:leftStop,partial:leftStop<s.b-1e-6}
      : {side:'right',from:s.b,to:rightStop,partial:rightStop>s.a+1e-6};
  }
  if(inLeft)return{side:'left',from:s.a,to:leftStop,partial:leftStop<s.b-1e-6};
  return{side:'right',from:s.b,to:rightStop,partial:rightStop>s.a+1e-6};
}
function snapshot(){return strips.map(s=>({a:s.a,b:s.b,removed:s.removed}))}
function commit(s,a){
  const stub=.012;
  if(a.side==='left'){
    if(a.partial)s.a=clamp(a.to-stub,s.a,s.b);else{s.a=s.b;s.removed=true}
  }else{
    if(a.partial)s.b=clamp(a.to+stub,s.a,s.b);else{s.b=s.a;s.removed=true}
  }
  if(s.b-s.a<.002)s.removed=true;
}

function render(){
  for(const s of strips){
    let a=s.a,b=s.b;
    if(animVisual&&animVisual.id===s.id){if(animVisual.side==='left')a=animVisual.cur;else b=animVisual.cur}
    if(s.removed&&!animVisual){s.el.style.display='none';continue}
    s.el.style.display='block';
    const p0=pointOn(s,a),p1=pointOn(s,b),len=hypot(p1.x-p0.x,p1.y-p0.y),ang=Math.atan2(p1.y-p0.y,p1.x-p0.x)*180/Math.PI;
    s.el.style.left=p0.x+'px';s.el.style.top=(p0.y-s.width/2)+'px';s.el.style.width=len+'px';s.el.style.height=s.width+'px';s.el.style.transform=`rotate(${ang}deg)`;
  }
  status.innerHTML=`<b>${strips.filter(s=>!s.removed).length} tapes left</b><br>${contacts.filter(activeContact).length} active fixed contacts`;
  undoBtn.disabled=!history.length||animating;undoBtn.style.opacity=history.length&&!animating?1:.4;
}
function pointSegHit(p,s){
  const p0=pointOn(s,s.a),p1=pointOn(s,s.b),vx=p1.x-p0.x,vy=p1.y-p0.y,wx=p.x-p0.x,wy=p.y-p0.y,vv=vx*vx+vy*vy;
  let u=vv?((wx*vx+wy*vy)/vv):0;u=clamp(u,0,1);const qx=p0.x+vx*u,qy=p0.y+vy*u;
  return{dist:hypot(p.x-qx,p.y-qy),t:s.a+(s.b-s.a)*u};
}
function contactAtPoint(p,c){
  const h=strips[c.hid],v=strips[c.vid];
  const hx=(v.ax-h.ax)/(h.bx-h.ax),vy=(h.ay-v.ay)/(v.by-v.ay);
  const hp=pointOn(h,hx),vp=pointOn(v,vy);
  return Math.abs(p.x-hp.x)<=Math.max(h.width,v.width)/2 && Math.abs(p.y-vp.y)<=Math.max(h.width,v.width)/2;
}
function pickTape(p){
  const infos=strips.filter(s=>!s.removed).map(s=>({s,...pointSegHit(p,s)}));
  const strict=infos.filter(x=>x.dist<=x.s.width/2);
  if(strict.length===1)return strict[0];
  if(strict.length>1){
    const here=contacts.filter(c=>activeContact(c)&&contactAtPoint(p,c));
    if(here.length){
      for(const c of here){
        const hit=strict.find(x=>x.s.id===c.upper);
        if(hit)return hit;
      }
    }
    strict.sort((a,b)=>a.dist-b.dist);
    return strict[0];
  }
  const slop=5/view.scale,near=infos.filter(x=>x.dist<=x.s.width/2+slop).sort((a,b)=>a.dist-b.dist);
  return near[0]||null;
}

async function peelTarget(target){
  const s=target.s,a=freeAccess(s,target.t);
  if(!a){if(navigator.vibrate)navigator.vibrate(4);return}
  history.push(snapshot());animating=true;
  const start=a.from,end=a.to,t0=performance.now(),dur=320+Math.min(650,Math.abs(end-start)*950);
  s.roll.style.opacity='1';
  await new Promise(resolve=>{
    function frame(now){
      const p=clamp((now-t0)/dur,0,1),e=1-Math.pow(1-p,3),cur=start+(end-start)*e,rp=pointOn(s,cur);
      animVisual={id:s.id,side:a.side,cur};
      s.roll.style.left=rp.x+'px';s.roll.style.top=rp.y+'px';s.roll.style.transform=`translate(-50%,-50%) scale(${1+.22*Math.sin(p*Math.PI)})`;
      render();
      if(p<1)requestAnimationFrame(frame);else resolve();
    }requestAnimationFrame(frame)
  });
  animVisual=null;commit(s,a);s.roll.style.opacity='0';animating=false;render();
}

viewport.addEventListener('pointerdown',e=>{
  if(animating)return;e.preventDefault();viewport.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const wp=screenToWorld(e.clientX,e.clientY);
  if(pointers.size===1){
    tapCandidate={id:e.pointerId,startX:e.clientX,startY:e.clientY,world:wp,moved:false};
    gesture={type:'pan',startX:e.clientX,startY:e.clientY,startTx:view.tx,startTy:view.ty};
  }else if(pointers.size===2){
    tapCandidate=null;const ps=[...pointers.values()],dx=ps[1].x-ps[0].x,dy=ps[1].y-ps[0].y,d=hypot(dx,dy),cx=(ps[0].x+ps[1].x)/2,cy=(ps[0].y+ps[1].y)/2;
    gesture={type:'pinch',startDist:d,startScale:view.scale,cx,cy,worldCenter:screenToWorld(cx,cy)};
  }
},{passive:false});
viewport.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId)||animating)return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(tapCandidate&&e.pointerId===tapCandidate.id&&hypot(e.clientX-tapCandidate.startX,e.clientY-tapCandidate.startY)>8)tapCandidate.moved=true;
  if(pointers.size===1&&gesture?.type==='pan'&&tapCandidate?.moved){
    const p=[...pointers.values()][0];view.tx=gesture.startTx+p.x-gesture.startX;view.ty=gesture.startTy+p.y-gesture.startY;applyView();
  }else if(pointers.size===2){
    tapCandidate=null;const ps=[...pointers.values()],dx=ps[1].x-ps[0].x,dy=ps[1].y-ps[0].y,d=hypot(dx,dy);
    if(gesture?.type!=='pinch'){const cx=(ps[0].x+ps[1].x)/2,cy=(ps[0].y+ps[1].y)/2;gesture={type:'pinch',startDist:d,startScale:view.scale,cx,cy,worldCenter:screenToWorld(cx,cy)}}
    const ns=clamp(gesture.startScale*(d/gesture.startDist),.28,2.5),r=viewport.getBoundingClientRect(),lx=gesture.cx-r.left,ly=gesture.cy-r.top;
    view.scale=ns;view.tx=lx-gesture.worldCenter.x*ns;view.ty=ly-gesture.worldCenter.y*ns;applyView();
  }
},{passive:false});
async function endPointer(e){
  if(!pointers.has(e.pointerId))return;
  const cand=tapCandidate&&tapCandidate.id===e.pointerId?{...tapCandidate}:null;
  pointers.delete(e.pointerId);
  if(cand&&!cand.moved&&pointers.size===0&&!animating){
    const target=pickTape(cand.world);
    if(target)await peelTarget(target);
  }
  if(pointers.size===1){const p=[...pointers.values()][0];gesture={type:'pan',startX:p.x,startY:p.y,startTx:view.tx,startTy:view.ty}}
  else if(!pointers.size)gesture=null;
  tapCandidate=null;
}
viewport.addEventListener('pointerup',endPointer);
viewport.addEventListener('pointercancel',endPointer);
viewport.addEventListener('wheel',e=>{
  e.preventDefault();const r=viewport.getBoundingClientRect(),lx=e.clientX-r.left,ly=e.clientY-r.top,bx=(lx-view.tx)/view.scale,by=(ly-view.ty)/view.scale,ns=clamp(view.scale*(e.deltaY<0?1.1:.9),.28,2.5);
  view.scale=ns;view.tx=lx-bx*ns;view.ty=ly-by*ns;applyView();
},{passive:false});

undoBtn.addEventListener('click',()=>{
  if(!history.length||animating)return;
  const h=history.pop();h.forEach((x,i)=>Object.assign(strips[i],x));render();
});
resetBtn.addEventListener('click',buildFixedBoard);
window.addEventListener('resize',fitWorld);
requestAnimationFrame(buildFixedBoard);
})();
</script>
</body>
</html>
