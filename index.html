// Fit the entire recognisable face comfortably inside the playing screen.
const marginX=42, marginY=48;
const ds=Math.min((W-marginX*2)/MW,(H-58-marginY*2)/MH);
const DW=MW*ds,DH=MH*ds,DX=(W-DW)/2,DY=marginY;

const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function load(src){return new Promise((ok,bad)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=()=>bad(new Error('Embedded artwork failed to decode'));im.src=src;});}

try{
  const [rimg,wimg]=await Promise.all([load(REGION),load(WALL)]);

  const rc=document.createElement('canvas');rc.width=MW;rc.height=MH;
  const rctx=rc.getContext('2d',{willReadFrequently:true});rctx.drawImage(rimg,0,0);
  const rd=rctx.getImageData(0,0,MW,MH).data;
  const intended=new Uint16Array(MW*MH);
  for(let i=0;i<intended.length;i++)intended[i]=rd[i*4]+(rd[i*4+1]<<8);

  const wc=document.createElement('canvas');wc.width=MW;wc.height=MH;
  const wctx=wc.getContext('2d',{willReadFrequently:true});wctx.drawImage(wimg,0,0);
  const wd=wctx.getImageData(0,0,MW,MH).data;
  const wall=new Uint8Array(MW*MH);
  for(let i=0;i<wall.length;i++)wall[i]=wd[i*4+3]>100?1:0;

  // Static linework.
  lctx.fillStyle=paper;lctx.fillRect(0,0,W,H);
  lctx.imageSmoothingEnabled=true;
  lctx.drawImage(wimg,DX,DY,DW,DH);

  // Paint surface.
  const sim=document.createElement('canvas');sim.width=MW;sim.height=MH;
  const sctx=sim.getContext('2d');
  const simImage=sctx.createImageData(MW,MH);
  const pr=rgb(paper);
  for(let i=0;i<intended.length;i++){const j=i*4;simImage.data[j]=pr[0];simImage.data[j+1]=pr[1];simImage.data[j+2]=pr[2];simImage.data[j+3]=255;}
  sctx.putImageData(simImage,0,0);
  fctx.fillStyle=paper;fctx.fillRect(0,0,W,H);
  fctx.drawImage(sim,DX,DY,DW,DH);

  const owner=new Int16Array(MW*MH);owner.fill(-1);
  const started=new Uint8Array(MAXID+1);
  const sources=[],heap=[];let dirty=false;

  function push(v){let i=heap.length;heap.push(v);while(i){const p=(i-1)>>1;if(heap[p].t<=v.t)break;heap[i]=heap[p];i=p;}heap[i]=v;}
  function pop(){if(!heap.length)return null;const f=heap[0],last=heap.pop();if(heap.length){let i=0;while(true){const l=i*2+1,r=l+1;if(l>=heap.length)break;let c=l;if(r<heap.length&&heap[r].t<heap[l].t)c=r;if(heap[c].t>=last.t)break;heap[i]=heap[c];i=c;}heap[i]=last;}return f;}

  const dirs=[],seen=new Set();
  function gcd(a,b){while(b){const t=a%b;a=b;b=t;}return Math.abs(a)||1;}
  for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
    if(!dx&&!dy)continue;
    const g=gcd(Math.abs(dx),Math.abs(dy)),k=(dx/g)+','+(dy/g);
    if(seen.has(k))continue;seen.add(k);dirs.push([dx,dy,Math.hypot(dx,dy)]);
  }

  function clearSeg(x0,y0,x1,y1){
    const dx=x1-x0,dy=y1-y0,n=Math.max(Math.abs(dx),Math.abs(dy));
    for(let q=1;q<=n;q++){
      const x=Math.round(x0+dx*q/n),y=Math.round(y0+dy*q/n);
      if(x<0||y<0||x>=MW||y>=MH)return false;
      const i=y*MW+x;if(wall[i]||!intended[i])return false;
    }
    return true;
  }

  const SPEED=11.5,clock0=performance.now()/1000;
  const best=(src,i)=>src.best.get(i)??Infinity;
  function schedule(i,sid,t){
    const src=sources[sid],x=i%MW,y=(i/MW)|0;
    for(const [dx,dy,cost] of dirs){
      const nx=x+dx,ny=y+dy;if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
      const ni=ny*MW+nx;if(wall[ni]||!intended[ni])continue;
      if(owner[ni]!==-1&&owner[ni]!==sid)continue;
      if(!clearSeg(x,y,nx,ny))continue;
      const nt=t+cost/SPEED;
      if(nt+1e-6<best(src,ni)){src.best.set(ni,nt);push({i:ni,sid,t:nt});}
    }
  }

  function startFill(id,mx,my){
    if(!id||started[id])return;
    started[id]=1;
    let x=Math.max(1,Math.min(MW-2,Math.floor(mx))),y=Math.max(1,Math.min(MH-2,Math.floor(my))),i=y*MW+x;

    if(wall[i]||intended[i]!==id){
      search:
      for(let r=1;r<18;r++)for(let yy=-r;yy<=r;yy++)for(let xx=-r;xx<=r;xx++){
        const nx=x+xx,ny=y+yy;if(nx<1||ny<1||nx>=MW-1||ny>=MH-1)continue;
        const ni=ny*MW+nx;if(!wall[ni]&&intended[ni]===id){i=ni;break search;}
      }
    }
    if(owner[i]!==-1)return;

    const sid=sources.length,now=performance.now()/1000-clock0;
    const src={id,rgb:rgb(colors[id]||'#7ecb9f'),best:new Map()};
    sources.push(src);src.best.set(i,now);push({i,sid,t:now});
  }

  function advance(now){
    let n=0;
    while(heap.length&&heap[0].t<=now&&n<10000){
      n++;const e=pop(),src=sources[e.sid];
      if(!src||Math.abs(best(src,e.i)-e.t)>.0001)continue;
      if(owner[e.i]!==-1){if(owner[e.i]!==e.sid)continue;}
      else{
        owner[e.i]=e.sid;
        const c=src.rgb,j=e.i*4;simImage.data[j]=c[0];simImage.data[j+1]=c[1];simImage.data[j+2]=c[2];simImage.data[j+3]=255;dirty=true;
      }
      schedule(e.i,e.sid,e.t);
    }
  }

  let lastBlit=0,lastStats=0;
  function draw(ms){
    if(dirty&&ms-lastBlit>32){
      lastBlit=ms;dirty=false;sctx.putImageData(simImage,0,0);
      fctx.fillStyle=paper;fctx.fillRect(0,0,W,H);fctx.imageSmoothingEnabled=true;fctx.drawImage(sim,DX,DY,DW,DH);
    }
    if(ms-lastStats>180){
      lastStats=ms;let total=0,col=0,correct=0;
      for(let i=0;i<intended.length;i++){
        if(!intended[i]||wall[i])continue;
        total++;const sid=owner[i];
        if(sid>=0){col++;if(sources[sid].id===intended[i])correct++;}
      }
      completeEl.textContent=(total?100*col/total:0).toFixed(1)+'%';
      accuracyEl.textContent=(col?100*correct/col:100).toFixed(1)+'%';
    }
  }
  function loop(ms){advance(ms/1000-clock0);draw(ms);requestAnimationFrame(loop);}
  requestAnimationFrame(loop);
  status.classList.add('hidden');

  let zoom=1,panX=0,panY=0,last=null,start=null,moved=false,pinch=null;
  const pointers=new Map();
  function apply(){stage.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;}
  function clamp(){
    const vr=view.getBoundingClientRect(),baseW=vr.width,baseH=baseW*(H/W),sw=baseW*zoom,sh=baseH*zoom;
    panX=Math.max(Math.min(0,vr.width-sw),Math.min(0,panX));
    panY=Math.max(Math.min(0,vr.height-sh),Math.min(0,panY));
  }
  function world(x,y){const r=stage.getBoundingClientRect();return{x:(x-r.left)*(W/r.width),y:(y-r.top)*(H/r.height)};}
  function zoomAt(f,x,y){
    const before=world(x,y),next=Math.max(1,Math.min(6,zoom*f));if(next===zoom)return;
    zoom=next;const vr=view.getBoundingClientRect(),bs=vr.width/W;
    panX=(x-vr.left)-before.x*bs*zoom;panY=(y-vr.top)-before.y*bs*zoom;clamp();apply();
  }

  view.addEventListener('pointerdown',e=>{
    view.setPointerCapture(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    start=last={x:e.clientX,y:e.clientY};moved=false;view.classList.add('dragging');
    if(pointers.size===2){const p=[...pointers.values()];pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),z:zoom};}
  });
  view.addEventListener('pointermove',e=>{
    if(!pointers.has(e.pointerId))return;pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pointers.size===2){
      const p=[...pointers.values()],d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
      if(pinch){const target=Math.max(1,Math.min(6,pinch.z*d/pinch.d));zoomAt(target/zoom,(p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2);}
      moved=true;return;
    }
    if(last){
      if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>5)moved=true;
      if(moved){panX+=e.clientX-last.x;panY+=e.clientY-last.y;clamp();apply();}
      last={x:e.clientX,y:e.clientY};
    }
  });
  view.addEventListener('pointerup',e=>{
    if(!moved&&pointers.size===1){
      const p=world(e.clientX,e.clientY);
      if(p.x>=DX&&p.x<=DX+DW&&p.y>=DY&&p.y<=DY+DH){
        const mx=(p.x-DX)/DW*MW,my=(p.y-DY)/DH*MH,x=Math.floor(mx),y=Math.floor(my);
        if(x>=0&&y>=0&&x<MW&&y<MH){const id=intended[y*MW+x];if(id)startFill(id,mx,my);}
      }
    }
    pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;last=start=null;view.classList.remove('dragging');
  });
  view.addEventListener('pointercancel',e=>{pointers.delete(e.pointerId);if(pointers.size<2)pinch=null;view.classList.remove('dragging');});
  view.addEventListener('wheel',e=>{e.preventDefault();zoomAt(e.deltaY<0?1.12:.89,e.clientX,e.clientY);},{passive:false});
  apply();

}catch(err){
  console.error(err);
  status.textContent='Could not initialise face: '+(err?.message||'unknown error');
}
})();
