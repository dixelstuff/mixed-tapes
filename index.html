<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TAPE — construction history proof</title>
<style>
:root{
  --bg:#0f1623;
  --fg:#eef3fb;
  --muted:#98a5b8;
  --panel:#1c2839;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--fg);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{display:flex;justify-content:center}
#app{
  width:min(100vw,680px);height:100dvh;display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom);
}
header{
  height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 4px;
}
.brand{font-size:14px;font-weight:800;letter-spacing:.17em}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
button{
  border:0;border-radius:14px;background:var(--panel);color:var(--fg);
  padding:10px 14px;font:inherit;font-weight:700
}
#viewport{
  position:relative;flex:1;min-height:0;overflow:hidden;border-radius:18px;
  background:var(--bg);touch-action:none;
}
canvas{
  position:absolute;inset:0;width:100%;height:100%;touch-action:none;
}
#hud{
  position:absolute;left:12px;top:12px;z-index:5;padding:8px 10px;border-radius:12px;
  background:rgba(18,26,40,.76);backdrop-filter:blur(8px);
  font-size:12px;color:#d9e0eb;pointer-events:none;
}
footer{
  height:72px;display:flex;align-items:center;justify-content:space-between;
  padding:4px 2px 0;gap:10px
}
#status{font-size:13px;line-height:1.35;color:#aeb8c7}
#status b{color:#fff}
@media(max-height:700px){
  header{height:52px}.sub{display:none}footer{height:60px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="brand">TAPE · HISTORY TEST 6</div>
      <div class="sub">clean-by-construction lanes · stronger tape texture</div>
    </div>
    <button id="newBtn">New history</button>
  </header>

  <div id="viewport">
    <canvas id="canvas"></canvas>
    <div id="hud">tap a free end · pinch to zoom · drag to pan</div>
  </div>

  <footer>
    <div id="status"><b>Construction-history model</b><br>Building tape stack…</div>
    <button id="undoBtn">Undo</button>
  </footer>
</div>

<script>
(()=>{
const viewport=document.getElementById('viewport');
const canvas=document.getElementById('canvas');
const ctx=canvas.getContext('2d');
const status=document.getElementById('status');
const newBtn=document.getElementById('newBtn');
const undoBtn=document.getElementById('undoBtn');

const WORLD_W=1100;
const WORLD_H=1450;
const COLORS=['#ef5d5d','#f2bf4c','#4da2e0','#61bf85','#9b76d5','#e887ba','#ef8d50','#53c5bd'];

let strips=[];
let contacts=[];
let history=[];
let peelGhosts=[];
let view={scale:.5,tx:0,ty:0};
let pointers=new Map();
let gesture=null;
let tapCandidate=null;
let rafPending=false;

const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const rand=(a,b)=>a+Math.random()*(b-a);
const hypot=Math.hypot;

function resizeCanvas(){
  const dpr=Math.max(1,Math.min(2,window.devicePixelRatio||1));
  const r=viewport.getBoundingClientRect();
  canvas.width=Math.round(r.width*dpr);
  canvas.height=Math.round(r.height*dpr);
  canvas._dpr=dpr;
  fitWorld();
  requestDraw();
}

function fitWorld(){
  const r=viewport.getBoundingClientRect();
  const s=Math.min(r.width/WORLD_W,r.height/WORLD_H)*0.94;
  view.scale=s;
  view.tx=(r.width-WORLD_W*s)/2;
  view.ty=(r.height-WORLD_H*s)/2;
}

function screenToWorld(x,y){
  const r=viewport.getBoundingClientRect();
  return{
    x:(x-r.left-view.tx)/view.scale,
    y:(y-r.top-view.ty)/view.scale
  };
}

function worldToScreen(p){
  return{x:view.tx+p.x*view.scale,y:view.ty+p.y*view.scale};
}

function pointOn(s,t){
  return{
    x:s.ax+(s.bx-s.ax)*t,
    y:s.ay+(s.by-s.ay)*t
  };
}

function geom(s){
  const dx=s.bx-s.ax,dy=s.by-s.ay,L=hypot(dx,dy);
  return{x1:s.ax,y1:s.ay,x2:s.bx,y2:s.by,dx,dy,L,ux:dx/L,uy:dy/L};
}


function tapePolygon(s){
  const g=geom(s);
  const nx=-g.uy*(s.width/2),ny=g.ux*(s.width/2);
  return[
    {x:g.x1+nx,y:g.y1+ny},
    {x:g.x2+nx,y:g.y2+ny},
    {x:g.x2-nx,y:g.y2-ny},
    {x:g.x1-nx,y:g.y1-ny}
  ];
}

function signedArea(poly){
  let a=0;
  for(let i=0;i<poly.length;i++){
    const p=poly[i],q=poly[(i+1)%poly.length];
    a+=p.x*q.y-q.x*p.y;
  }
  return a/2;
}

function polygonArea(poly){
  return Math.abs(signedArea(poly));
}

function clipPolygon(subject,clip){
  let output=subject.slice();
  const sign=signedArea(clip)>=0?1:-1;

  for(let j=0;j<clip.length;j++){
    const A=clip[j],B=clip[(j+1)%clip.length];
    const input=output;
    output=[];
    if(!input.length)break;

    const inside=P=>sign*((B.x-A.x)*(P.y-A.y)-(B.y-A.y)*(P.x-A.x))>=-1e-8;

    const intersect=(P,Q)=>{
      const rx=Q.x-P.x,ry=Q.y-P.y;
      const sx=B.x-A.x,sy=B.y-A.y;
      const den=rx*sy-ry*sx;
      if(Math.abs(den)<1e-10)return Q;
      const t=((A.x-P.x)*sy-(A.y-P.y)*sx)/den;
      return{x:P.x+t*rx,y:P.y+t*ry};
    };

    let S=input[input.length-1];
    for(const E of input){
      const Ein=inside(E),Sin=inside(S);
      if(Ein){
        if(!Sin)output.push(intersect(S,E));
        output.push(E);
      }else if(Sin){
        output.push(intersect(S,E));
      }
      S=E;
    }
  }
  return output;
}

function projectSpan(poly,s){
  const g=geom(s);
  const den=g.dx*g.dx+g.dy*g.dy;
  const ts=poly.map(p=>((p.x-g.x1)*g.dx+(p.y-g.y1)*g.dy)/den);
  return[
    clamp(Math.min(...ts),0,1),
    clamp(Math.max(...ts),0,1)
  ];
}

function localStickTime(s,t){
  for(const phase of s.phases){
    if(t>=phase.a-1e-8 && t<=phase.b+1e-8)return phase.time;
  }
  return -Infinity;
}

function segmentIntersection(a,b){
  const ax=a.ax,ay=a.ay,arx=a.bx-a.ax,ary=a.by-a.ay;
  const bx=b.ax,by=b.ay,brx=b.bx-b.ax,bry=b.by-b.ay;
  const cross=(x1,y1,x2,y2)=>x1*y2-y1*x2;
  const den=cross(arx,ary,brx,bry);
  if(Math.abs(den)<1e-8)return null;
  const qx=bx-ax,qy=by-ay;
  const ta=cross(qx,qy,brx,bry)/den;
  const tb=cross(qx,qy,arx,ary)/den;
  if(ta<=.025||ta>=.975||tb<=.025||tb>=.975)return null;
  return{ta,tb};
}

function buildContacts(){
  contacts=[];
  for(let i=0;i<strips.length;i++){
    for(let j=i+1;j<strips.length;j++){
      const a=strips[i],b=strips[j];
      const hit=segmentIntersection(a,b);
      if(!hit)continue;

      const ga=geom(a),gb=geom(b);
      const dot=Math.abs(ga.ux*gb.ux+ga.uy*gb.uy);
      if(dot>.42)continue; // avoid ambiguous near-parallel contacts

      // substantial overlap is guaranteed by center-line crossing and wide ribbons.
      const ta=hit.ta,tb=hit.tb;
      const timeA=localStickTime(a,ta);
      const timeB=localStickTime(b,tb);

      const upper=timeA>timeB?a:b;
      const lower=upper===a?b:a;
      const tUpper=upper===a?ta:tb;
      const tLower=upper===a?tb:ta;

      // width projected to each tape as a local contact span.
      const spanUpper=(lower.width/2)/geom(upper).L;
      const spanLower=(upper.width/2)/geom(lower).L;

      contacts.push({
        a:a.id,b:b.id,
        ta,tb,
        upper:upper.id,
        lower:lower.id,
        upperSpan:[clamp(tUpper-spanUpper,0,1),clamp(tUpper+spanUpper,0,1)],
        lowerSpan:[clamp(tLower-spanLower,0,1),clamp(tLower+spanLower,0,1)]
      });
    }
  }
}

function generateTapeGeometry(){
  strips=[];

  // Clean-by-construction layout:
  // same-direction tapes live in separated lanes, so they can never
  // create ambiguous near-parallel physical overlaps.
  const nH=10,nV=10;
  let id=0;

  const hTop=85,hBottom=WORLD_H-85;
  const hSpacing=(hBottom-hTop)/(nH+1);

  for(let i=0;i<nH;i++){
    const laneY=hTop+(i+1)*hSpacing;
    const y=laneY+rand(-10,10);

    // Keep tilt modest relative to lane spacing so neighbouring
    // horizontal-ish tapes remain physically separated.
    const tilt=rand(-32,32);

    const insetL=rand(45,155);
    const insetR=rand(45,155);

    strips.push({
      id:id++,
      ax:insetL,
      ay:y-tilt/2,
      bx:WORLD_W-insetR,
      by:y+tilt/2,
      width:rand(54,66),
      color:COLORS[i%COLORS.length],
      patternSpacing:rand(36,52),
      patternOffset:rand(0,42),
      patternSlant:rand(.18,.52),
      phases:[],
      intervals:[[0,1]],
      removed:false
    });
  }

  const vLeft=75,vRight=WORLD_W-75;
  const vSpacing=(vRight-vLeft)/(nV+1);

  for(let i=0;i<nV;i++){
    const laneX=vLeft+(i+1)*vSpacing;
    const x=laneX+rand(-8,8);

    // Vertical lanes are closer together, so use an even smaller tilt.
    const tilt=rand(-22,22);

    const insetT=rand(45,155);
    const insetB=rand(45,155);

    strips.push({
      id:id++,
      ax:x-tilt/2,
      ay:insetT,
      bx:x+tilt/2,
      by:WORLD_H-insetB,
      width:rand(54,64),
      color:COLORS[(i+3)%COLORS.length],
      patternSpacing:rand(36,52),
      patternOffset:rand(0,42),
      patternSlant:rand(.18,.52),
      phases:[],
      intervals:[[0,1]],
      removed:false
    });
  }
}

function rawCrossingsForStrip(target){
  const zones=[];

  for(const other of strips){
    if(other.id===target.id)continue;

    const gt=geom(target),go=geom(other);
    const dot=Math.abs(gt.ux*go.ux+gt.uy*go.uy);
    if(dot>.42)continue;

    const poly=clipPolygon(tapePolygon(target),tapePolygon(other));
    if(poly.length<3 || polygonArea(poly)<=0)continue;

    const span=projectSpan(poly,target);
    const pad=12/gt.L;

    zones.push([
      clamp(span[0]-pad,0,1),
      clamp(span[1]+pad,0,1)
    ]);
  }

  return zones;
}

function safeSplitForStrip(s){
  const forbidden=rawCrossingsForStrip(s);

  // Try natural-looking central split locations first.
  const candidates=[];
  for(let i=0;i<40;i++)candidates.push(rand(.30,.70));

  // Pick the first split comfortably outside every physical crossing.
  for(const split of candidates){
    const bad=forbidden.some(z=>split>=z[0]&&split<=z[1]);
    if(!bad)return split;
  }

  // Fall back to the point in .25-.75 with greatest clearance.
  let best=.5,bestGap=-1;
  for(let k=0;k<=100;k++){
    const t=.25+k*.005;
    let gap=1;
    for(const z of forbidden){
      if(t>=z[0]&&t<=z[1]){gap=-1;break}
      gap=Math.min(gap,Math.abs(t-z[0]),Math.abs(t-z[1]));
    }
    if(gap>bestGap){bestGap=gap;best=t}
  }
  return best;
}

function assignConstructionHistory(){
  let ops=[];

  for(const s of strips){
    const fromLeft=Math.random()<.5;
    const split=safeSplitForStrip(s);

    s._fromLeft=fromLeft;
    s._split=split;

    if(fromLeft){
      ops.push({sid:s.id,a:0,b:split,part:0});
      ops.push({sid:s.id,a:split,b:1,part:1});
    }else{
      ops.push({sid:s.id,a:split,b:1,part:0});
      ops.push({sid:s.id,a:0,b:split,part:1});
    }
  }

  // Simulate "stick some starts, then come back and finish others".
  // A weighted interleave gives much richer local over/under relationships
  // than simply doing all first halves and then all second halves.
  const first=ops.filter(o=>o.part===0);
  const second=ops.filter(o=>o.part===1);

  const shuffle=a=>{
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [a[i],a[j]]=[a[j],a[i]];
    }
  };
  shuffle(first);
  shuffle(second);

  const sequence=[];
  const started=new Set();

  while(first.length || second.length){
    const canFinish=second.filter(o=>started.has(o.sid));

    const chooseFinish=
      canFinish.length &&
      sequence.length>3 &&
      Math.random()<.46;

    if(chooseFinish){
      const pick=Math.floor(Math.random()*canFinish.length);
      const op=canFinish[pick];
      const idx=second.indexOf(op);
      second.splice(idx,1);
      sequence.push(op);
    }else if(first.length){
      const op=first.pop();
      started.add(op.sid);
      sequence.push(op);
    }else if(canFinish.length){
      const op=canFinish[Math.floor(Math.random()*canFinish.length)];
      second.splice(second.indexOf(op),1);
      sequence.push(op);
    }else{
      // Safety fallback.
      sequence.push(second.pop());
    }
  }

  strips.forEach(s=>s.phases=[]);

  sequence.forEach((o,idx)=>{
    strips[o.sid].phases.push({
      a:o.a,
      b:o.b,
      time:idx+1
    });
  });

  strips.forEach(s=>s.phases.sort((x,y)=>x.a-y.a));
}

function directedCycleExists(){
  const adj=new Map();
  strips.forEach(s=>adj.set(s.id,[]));
  contacts.forEach(c=>adj.get(c.upper).push(c.lower));

  const state=new Map();
  function dfs(v){
    state.set(v,1);
    for(const w of adj.get(v)){
      if(state.get(w)===1)return true;
      if(!state.get(w)&&dfs(w))return true;
    }
    state.set(v,2);
    return false;
  }
  for(const s of strips){
    if(!state.get(s.id)&&dfs(s.id))return true;
  }
  return false;
}

function variedDepthCount(){
  let count=0;
  for(const s of strips){
    let over=false,under=false;
    for(const c of contacts){
      if(c.upper===s.id)over=true;
      if(c.lower===s.id)under=true;
    }
    if(over&&under)count++;
  }
  return count;
}

function buildPuzzle(){
  history=[];
  peelGhosts=[];

  // Geometry itself is already guaranteed clean, so create it once.
  generateTapeGeometry();

  // Try a few construction histories to get a rich over/under network.
  // Never loop indefinitely: if the ideal thresholds aren't reached,
  // accept the best clean history found.
  let best=null;

  for(let attempt=0;attempt<24;attempt++){
    assignConstructionHistory();
    buildContacts();

    const score=
      contacts.length +
      variedDepthCount()*4 +
      (directedCycleExists()?20:0);

    if(!best || score>best.score){
      best={
        score,
        phases:strips.map(s=>s.phases.map(p=>({...p}))),
        contacts:contacts.map(c=>({
          ...c,
          upperSpan:c.upperSpan.slice(),
          lowerSpan:c.lowerSpan.slice()
        }))
      };
    }

    if(contacts.length>=42 && variedDepthCount()>=12 && directedCycleExists()){
      requestDraw();
      updateStatus();
      return;
    }
  }

  // Use the best clean history we found rather than stalling.
  if(best){
    strips.forEach((s,i)=>{
      s.phases=best.phases[i].map(p=>({...p}));
      s.intervals=[[0,1]];
      s.removed=false;
    });
    contacts=best.contacts.map(c=>({
      ...c,
      upperSpan:c.upperSpan.slice(),
      lowerSpan:c.lowerSpan.slice()
    }));
  }else{
    assignConstructionHistory();
    buildContacts();
  }

  requestDraw();
  updateStatus();
}

function intervalContains(iv,t){
  return t>=iv[0]-1e-7&&t<=iv[1]+1e-7;
}

function tapePresentAt(s,t){
  return !s.removed && s.intervals.some(iv=>intervalContains(iv,t));
}

function contactActive(c){
  const up=strips[c.upper];
  const center=(c.upperSpan[0]+c.upperSpan[1])/2;
  return tapePresentAt(up,center);
}

function blockerZonesFor(s){
  const out=[];
  for(const c of contacts){
    if(c.lower!==s.id || !contactActive(c))continue;
    out.push(c.lowerSpan.slice());
  }
  out.sort((a,b)=>a[0]-b[0]);

  // merge
  const merged=[];
  for(const z of out){
    if(!merged.length || z[0]>merged[merged.length-1][1]+1e-5){
      merged.push(z);
    }else{
      merged[merged.length-1][1]=Math.max(merged[merged.length-1][1],z[1]);
    }
  }
  return merged;
}

function peelAccess(s,t,iv){
  const zones=blockerZonesFor(s)
    .filter(z=>Math.min(z[1],iv[1])-Math.max(z[0],iv[0])>1e-6)
    .map(z=>[Math.max(z[0],iv[0]),Math.min(z[1],iv[1])]);

  let leftBlock=null;
  for(const z of zones){
    if(z[1]<=iv[0]+1e-6)continue;
    if(z[0]<=iv[0]+1e-6 && z[1]>iv[0]+1e-6){
      leftBlock={atEdge:true,zone:z};
      break;
    }
    if(z[0]>iv[0]+1e-6){
      leftBlock={atEdge:false,zone:z};
      break;
    }
  }

  let rightBlock=null;
  for(let i=zones.length-1;i>=0;i--){
    const z=zones[i];
    if(z[0]>=iv[1]-1e-6)continue;
    if(z[0]<iv[1]-1e-6 && z[1]>=iv[1]-1e-6){
      rightBlock={atEdge:true,zone:z};
      break;
    }
    if(z[1]<iv[1]-1e-6){
      rightBlock={atEdge:false,zone:z};
      break;
    }
  }

  const leftFree=!leftBlock||!leftBlock.atEdge;
  const rightFree=!rightBlock||!rightBlock.atEdge;
  const leftStop=leftBlock&&!leftBlock.atEdge?leftBlock.zone[0]:iv[1];
  const rightStop=rightBlock&&!rightBlock.atEdge?rightBlock.zone[1]:iv[0];

  const inLeft=leftFree && t>=iv[0]-1e-6 && t<=leftStop+1e-6;
  const inRight=rightFree && t>=rightStop-1e-6 && t<=iv[1]+1e-6;

  if(!inLeft&&!inRight)return null;

  if(inLeft&&inRight){
    const dl=t-iv[0],dr=iv[1]-t;
    if(dl<=dr)return{side:'left',from:iv[0],to:leftStop,zone:leftBlock&&!leftBlock.atEdge?leftBlock.zone:null,iv:iv.slice()};
    return{side:'right',from:iv[1],to:rightStop,zone:rightBlock&&!rightBlock.atEdge?rightBlock.zone:null,iv:iv.slice()};
  }

  if(inLeft)return{side:'left',from:iv[0],to:leftStop,zone:leftBlock&&!leftBlock.atEdge?leftBlock.zone:null,iv:iv.slice()};
  return{side:'right',from:iv[1],to:rightStop,zone:rightBlock&&!rightBlock.atEdge?rightBlock.zone:null,iv:iv.slice()};
}

function findIntervalIndex(s,bounds){
  let best=-1,err=Infinity;
  s.intervals.forEach((iv,i)=>{
    const e=Math.abs(iv[0]-bounds[0])+Math.abs(iv[1]-bounds[1]);
    if(e<err){err=e;best=i;}
  });
  return err<.03?best:-1;
}

function snapshot(){
  return strips.map(s=>({
    intervals:s.intervals.map(iv=>iv.slice()),
    removed:s.removed
  }));
}

function commitPeel(s,a){
  const idx=findIntervalIndex(s,a.iv);
  if(idx<0)return;
  const iv=s.intervals[idx];
  const STUB=.008;

  if(a.zone){
    if(a.side==='left'){
      s.intervals[idx]=[clamp(a.zone[0]-STUB,iv[0],iv[1]),iv[1]];
    }else{
      s.intervals[idx]=[iv[0],clamp(a.zone[1]+STUB,iv[0],iv[1])];
    }
  }else{
    s.intervals.splice(idx,1);
  }

  s.intervals=s.intervals.filter(iv=>iv[1]-iv[0]>.002);
  s.removed=s.intervals.length===0;
}

function hitInfo(p,s){
  let best=null;
  for(const iv of s.intervals){
    const p0=pointOn(s,iv[0]),p1=pointOn(s,iv[1]);
    const vx=p1.x-p0.x,vy=p1.y-p0.y;
    const wx=p.x-p0.x,wy=p.y-p0.y;
    const vv=vx*vx+vy*vy;
    let u=vv?((wx*vx+wy*vy)/vv):0;
    u=clamp(u,0,1);
    const qx=p0.x+vx*u,qy=p0.y+vy*u;
    const d=hypot(p.x-qx,p.y-qy);
    const t=iv[0]+(iv[1]-iv[0])*u;
    if(!best||d<best.dist)best={dist:d,t,iv};
  }
  if(!best)return null;
  return{...best,inside:best.dist<=s.width/2,half:s.width/2};
}

function contactAtTap(p,c){
  if(!contactActive(c))return false;
  const ia=hitInfo(p,strips[c.a]);
  const ib=hitInfo(p,strips[c.b]);
  if(!ia||!ib||!ia.inside||!ib.inside)return false;

  const spanA=c.a===c.upper?c.upperSpan:c.lowerSpan;
  const spanB=c.b===c.upper?c.upperSpan:c.lowerSpan;

  return ia.t>=spanA[0]-1e-4&&ia.t<=spanA[1]+1e-4 &&
         ib.t>=spanB[0]-1e-4&&ib.t<=spanB[1]+1e-4;
}

function pickTape(p){
  const infos=strips
    .filter(s=>!s.removed)
    .map(s=>({s,...hitInfo(p,s)}))
    .filter(x=>x.iv);

  const strict=infos.filter(x=>x.inside);

  if(strict.length===1)return strict[0];

  if(strict.length>1){
    const here=contacts.filter(c=>contactAtTap(p,c));
    if(here.length){
      // local construction time decides what is visibly on top here.
      here.sort((x,y)=>{
        const ux=strips[x.upper],uy=strips[y.upper];
        const tx=(x.upperSpan[0]+x.upperSpan[1])/2;
        const ty=(y.upperSpan[0]+y.upperSpan[1])/2;
        return localStickTime(uy,ty)-localStickTime(ux,tx);
      });
      const topId=here[0].upper;
      const h=strict.find(x=>x.s.id===topId);
      if(h)return h;
    }

    strict.sort((a,b)=>a.dist-b.dist);
    return strict[0];
  }

  const slop=6/view.scale;
  const near=infos.filter(x=>x.dist<=x.half+slop).sort((a,b)=>a.dist-b.dist);
  return near[0]||null;
}

function peelTape(target){
  const s=target.s;
  const a=peelAccess(s,target.t,target.iv);
  if(!a){
    if(navigator.vibrate)navigator.vibrate(4);
    return;
  }

  history.push(snapshot());

  // Functional state updates immediately.
  const ghost={
    sid:s.id,
    side:a.side,
    from:a.from,
    to:a.to,
    bounds:a.iv.slice(),
    start:performance.now(),
    duration:210+Math.min(300,Math.abs(a.to-a.from)*430)
  };

  commitPeel(s,a);
  peelGhosts.push(ghost);

  if(navigator.vibrate)navigator.vibrate(s.removed?12:6);
  updateStatus();
  requestDraw();
}

function updateStatus(){
  const remaining=strips.filter(s=>!s.removed).length;
  const active=contacts.filter(contactActive).length;
  const mixed=variedDepthCount();
  status.innerHTML=`<b>${remaining} tapes left</b><br>${active} active contacts · ${mixed} tapes currently go both over and under`;
  undoBtn.disabled=!history.length;
  undoBtn.style.opacity=history.length?1:.4;
}

function drawRibbonPhase(s,a,b){
  if(b-a<1e-6)return;

  const p0=pointOn(s,a),p1=pointOn(s,b);
  const dx=p1.x-p0.x,dy=p1.y-p0.y,L=hypot(dx,dy);
  if(L<.1)return;

  const ux=dx/L,uy=dy/L;
  const nx=-uy*(s.width/2),ny=ux*(s.width/2);

  ctx.beginPath();
  ctx.moveTo(p0.x+nx,p0.y+ny);
  ctx.lineTo(p1.x+nx,p1.y+ny);
  ctx.lineTo(p1.x-nx,p1.y-ny);
  ctx.lineTo(p0.x-nx,p0.y-ny);
  ctx.closePath();
  ctx.fillStyle=s.color;
  ctx.fill();

  // Subtle long-edge contour only.
  ctx.save();
  ctx.globalAlpha=.12;
  ctx.strokeStyle='#000';
  ctx.lineWidth=1.3;

  ctx.beginPath();
  ctx.moveTo(p0.x+nx,p0.y+ny);
  ctx.lineTo(p1.x+nx,p1.y+ny);
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(p0.x-nx,p0.y-ny);
  ctx.lineTo(p1.x-nx,p1.y-ny);
  ctx.stroke();
  ctx.restore();

  // Sparse diagonal texture, continuous in absolute tape coordinates.
  const g=geom(s);
  const absStart=a*g.L;
  const absEnd=b*g.L;
  const spacing=s.patternSpacing||56;
  const offset=s.patternOffset||0;

  let first=Math.ceil((absStart-offset)/spacing)*spacing+offset;

  ctx.save();
  ctx.globalAlpha=.18;
  ctx.strokeStyle='#fff';
  ctx.lineWidth=2.0;

  for(let d=first;d<=absEnd+1e-6;d+=spacing){
    const t=clamp(d/g.L,0,1);
    const c=pointOn(s,t);

    const half=s.width*.30;
    const along=s.width*(s.patternSlant||.3);

    const ex=nx/(s.width/2),ey=ny/(s.width/2);

    const ax=c.x-ex*half-ux*along*.5;
    const ay=c.y-ey*half-uy*along*.5;
    const bx=c.x+ex*half+ux*along*.5;
    const by=c.y+ey*half+uy*along*.5;

    ctx.beginPath();
    ctx.moveTo(ax,ay);
    ctx.lineTo(bx,by);
    ctx.stroke();
  }

  ctx.restore();
}

function visiblePhasePieces(s){
  const pieces=[];

  for(const iv of s.intervals){
    for(const phase of s.phases){
      const a=Math.max(iv[0],phase.a);
      const b=Math.min(iv[1],phase.b);
      if(b-a>1e-6){
        pieces.push({
          s,
          a,
          b,
          time:phase.time
        });
      }
    }
  }

  return pieces;
}

function ghostPhasePieces(now){
  const pieces=[];

  for(const g of peelGhosts){
    const s=strips[g.sid];
    const p=clamp((now-g.start)/g.duration,0,1);
    const ease=1-Math.pow(1-p,3);
    const cur=g.from+(g.to-g.from)*ease;

    let ga,gb;
    if(g.side==='left'){
      ga=cur;
      gb=g.bounds[1];
    }else{
      ga=g.bounds[0];
      gb=cur;
    }

    if(gb-ga<=1e-6)continue;

    for(const phase of s.phases){
      const a=Math.max(ga,phase.a);
      const b=Math.min(gb,phase.b);
      if(b-a>1e-6){
        pieces.push({
          s,
          a,
          b,
          time:phase.time,
          ghost:true
        });
      }
    }
  }

  return pieces;
}

function drawScene(){
  rafPending=false;

  const dpr=canvas._dpr||1;
  const r=viewport.getBoundingClientRect();

  ctx.setTransform(dpr,0,0,dpr,0,0);
  ctx.clearRect(0,0,r.width,r.height);
  ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--bg');
  ctx.fillRect(0,0,r.width,r.height);

  ctx.save();
  ctx.translate(view.tx,view.ty);
  ctx.scale(view.scale,view.scale);

  const now=performance.now();

  // The construction history itself is the z-order.
  // Each laid-down phase is rendered as ONE continuous polygon,
  // never as dozens of micro-segments.
  const pieces=[];

  for(const s of strips){
    pieces.push(...visiblePhasePieces(s));
  }
  pieces.push(...ghostPhasePieces(now));

  pieces.sort((a,b)=>{
    if(a.time!==b.time)return a.time-b.time;

    // Deterministic tie-break only. It does not create depth;
    // it simply prevents unstable sort flicker.
    if(a.s.id!==b.s.id)return a.s.id-b.s.id;
    return a.a-b.a;
  });

  for(const piece of pieces){
    drawRibbonPhase(piece.s,piece.a,piece.b);
  }

  // Cosmetic peel heads.
  for(const g of peelGhosts){
    const p=clamp((now-g.start)/g.duration,0,1);
    const ease=1-Math.pow(1-p,3);
    const cur=g.from+(g.to-g.from)*ease;
    const s=strips[g.sid];
    const pt=pointOn(s,cur);
    const radius=s.width*.25*(1+.10*Math.sin(p*Math.PI));

    ctx.save();
    ctx.translate(pt.x,pt.y);
    ctx.beginPath();
    ctx.ellipse(0,0,radius,radius*.64,0,0,Math.PI*2);
    ctx.fillStyle=s.color;
    ctx.fill();

    // Very small inner curl cue only — no long highlight along the tape.
    ctx.globalAlpha=.15;
    ctx.beginPath();
    ctx.ellipse(-radius*.18,0,radius*.26,radius*.17,0,0,Math.PI*2);
    ctx.fillStyle='#fff';
    ctx.fill();
    ctx.restore();
  }

  ctx.restore();

  const hadGhosts=peelGhosts.length>0;
  peelGhosts=peelGhosts.filter(g=>now-g.start<g.duration);

  if(peelGhosts.length){
    requestDraw();
  }else if(hadGhosts){
    // Guaranteed clean frame after the final peel head disappears.
    requestAnimationFrame(()=>{
      rafPending=false;
      requestDraw();
    });
  }
}

function requestDraw(){
  if(rafPending)return;
  rafPending=true;
  requestAnimationFrame(drawScene);
}

viewport.addEventListener('pointerdown',e=>{
  e.preventDefault();
  viewport.setPointerCapture?.(e.pointerId);
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
  const wp=screenToWorld(e.clientX,e.clientY);

  if(pointers.size===1){
    tapCandidate={id:e.pointerId,startX:e.clientX,startY:e.clientY,world:wp,moved:false};
    gesture={type:'pan',startX:e.clientX,startY:e.clientY,startTx:view.tx,startTy:view.ty};
  }else if(pointers.size===2){
    tapCandidate=null;
    const ps=[...pointers.values()];
    const dx=ps[1].x-ps[0].x,dy=ps[1].y-ps[0].y;
    const d=hypot(dx,dy);
    const cx=(ps[0].x+ps[1].x)/2,cy=(ps[0].y+ps[1].y)/2;
    gesture={type:'pinch',startDist:d,startScale:view.scale,cx,cy,worldCenter:screenToWorld(cx,cy)};
  }
},{passive:false});

viewport.addEventListener('pointermove',e=>{
  if(!pointers.has(e.pointerId))return;
  e.preventDefault();
  pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(tapCandidate&&e.pointerId===tapCandidate.id){
    if(hypot(e.clientX-tapCandidate.startX,e.clientY-tapCandidate.startY)>8)tapCandidate.moved=true;
  }

  if(pointers.size===1&&gesture?.type==='pan'&&tapCandidate?.moved){
    const p=[...pointers.values()][0];
    view.tx=gesture.startTx+p.x-gesture.startX;
    view.ty=gesture.startTy+p.y-gesture.startY;
    requestDraw();
  }else if(pointers.size===2){
    tapCandidate=null;
    const ps=[...pointers.values()];
    const dx=ps[1].x-ps[0].x,dy=ps[1].y-ps[0].y;
    const d=hypot(dx,dy);

    if(gesture?.type!=='pinch'){
      const cx=(ps[0].x+ps[1].x)/2,cy=(ps[0].y+ps[1].y)/2;
      gesture={type:'pinch',startDist:d,startScale:view.scale,cx,cy,worldCenter:screenToWorld(cx,cy)};
    }

    const ns=clamp(gesture.startScale*(d/gesture.startDist),.28,2.5);
    const r=viewport.getBoundingClientRect();
    const lx=gesture.cx-r.left,ly=gesture.cy-r.top;

    view.scale=ns;
    view.tx=lx-gesture.worldCenter.x*ns;
    view.ty=ly-gesture.worldCenter.y*ns;
    requestDraw();
  }
},{passive:false});

function endPointer(e){
  if(!pointers.has(e.pointerId))return;
  const cand=tapCandidate&&tapCandidate.id===e.pointerId?{...tapCandidate}:null;
  pointers.delete(e.pointerId);

  if(cand&&!cand.moved&&pointers.size===0){
    const target=pickTape(cand.world);
    if(target)peelTape(target);
  }

  if(pointers.size===1){
    const p=[...pointers.values()][0];
    gesture={type:'pan',startX:p.x,startY:p.y,startTx:view.tx,startTy:view.ty};
  }else if(!pointers.size){
    gesture=null;
  }

  tapCandidate=null;
}

viewport.addEventListener('pointerup',endPointer);
viewport.addEventListener('pointercancel',endPointer);

viewport.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=viewport.getBoundingClientRect();
  const lx=e.clientX-r.left,ly=e.clientY-r.top;
  const before={x:(lx-view.tx)/view.scale,y:(ly-view.ty)/view.scale};
  const ns=clamp(view.scale*(e.deltaY<0?1.1:.9),.28,2.5);

  view.scale=ns;
  view.tx=lx-before.x*ns;
  view.ty=ly-before.y*ns;
  requestDraw();
},{passive:false});

undoBtn.addEventListener('click',()=>{
  if(!history.length)return;
  const snap=history.pop();
  strips.forEach((s,i)=>{
    s.intervals=snap[i].intervals.map(iv=>iv.slice());
    s.removed=snap[i].removed;
  });
  peelGhosts=[];
  updateStatus();
  requestDraw();
});

newBtn.addEventListener('click',buildPuzzle);
window.addEventListener('resize',resizeCanvas);

resizeCanvas();
buildPuzzle();
})();
</script>
</body>
</html>
