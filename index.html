<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AHA — Five Levels</title>
<style>
:root{
  --bg:#f3f0e8; --paper:#fffdf8; --ink:#181818; --muted:#8c867d;
  --line:#d9d2c8; --soft:#ebe6dd; --select:#e7e0d5; --green:#24834b;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}
.shell{max-width:620px;margin:auto;padding:24px 16px 48px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.brand{font-weight:900;letter-spacing:.12em;font-size:13px}
.progress{font-size:13px;color:var(--muted);font-weight:700}
.label{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted)}
.clue,.sentence{font-size:27px;line-height:1.58}
.clue{margin:9px 0 23px}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:18px;padding:17px}
.word{
  appearance:none;-webkit-appearance:none;border:0;background:transparent;
  margin:0 .03em .08em 0;padding:0 .04em;font:inherit;color:inherit;
  border-radius:7px;cursor:pointer;
}
.word.selected{background:var(--select);box-shadow:0 0 0 4px var(--select)}
.word.user-b{font-weight:800}
.word.user-i{font-style:italic}
.word.locked{
  color:var(--green);background:transparent!important;
  box-shadow:none!important;cursor:default;
}
.toolbar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:19px}
.tool{
  height:50px;border:0;border-radius:12px;background:var(--soft);color:var(--ink);
  font-size:24px;appearance:none;-webkit-appearance:none;cursor:pointer;
}
.tool.active{background:var(--ink);color:white}
.tool:disabled{color:#c8c2b9;background:#f1eee8;cursor:default}
#boldBtn{font-weight:800}
#italicBtn{font-style:italic}
#underlineBtn{text-decoration:underline}
.check,.next{
  width:100%;height:49px;margin-top:9px;border:0;border-radius:12px;
  background:var(--ink);color:white;font-weight:800;font-size:14px;
  appearance:none;-webkit-appearance:none;cursor:pointer;
}
.result{
  display:none;margin-top:13px;padding:14px;border:1px solid var(--line);
  border-radius:15px;background:var(--paper);line-height:1.55
}
.score{font-weight:900}
.rules{margin-top:8px;padding:11px;border-radius:10px;background:#eee9df}
.next{display:none}
.finished{display:none;text-align:center;padding:34px 10px 10px}
.finished h2{margin:0 0 8px;font-size:25px}
.finished p{margin:0;color:var(--muted)}
button:focus-visible,.word:focus-visible{
  outline:3px solid rgba(24,24,24,.22);outline-offset:3px
}
@media(max-width:480px){
  .clue,.sentence{font-size:24px}
  .shell{padding-top:18px}
}
</style>
</head>
<body>
<div class="shell">
  <div class="top">
    <div class="brand">AHA</div>
    <div class="progress" id="progress"></div>
  </div>

  <main id="game">
    <div class="label">CLUE</div>
    <div class="clue" id="clue"></div>

    <div class="panel">
      <div class="sentence" id="sentence"></div>

      <div class="toolbar">
        <button class="tool" id="boldBtn" type="button">B</button>
        <button class="tool" id="italicBtn" type="button">I</button>
        <button class="tool" id="underlineBtn" type="button" disabled>U</button>
      </div>

      <button class="check" id="checkBtn" type="button">CHECK</button>
    </div>

    <div class="result" id="result">
      <div class="score" id="score"></div>
      <div class="rules" id="rules"></div>
      <button class="next" id="nextBtn" type="button">NEXT LEVEL</button>
    </div>
  </main>

  <div class="finished" id="finished">
    <h2>Five out of five.</h2>
    <p id="finalScores"></p>
  </div>
</div>

<script>
const LEVELS = [{"clue": [{"text": "Present", "b": true, "i": false}, {"text": "diners", "b": false, "i": true}, {"text": "refuse", "b": true, "i": false}, {"text": "spoiled", "b": false, "i": true}, {"text": "produce", "b": true, "i": true}, {"text": "inside", "b": false, "i": true}], "puzzle": [{"text": "Minute", "b": true, "i": false}, {"text": "details", "b": false, "i": true}, {"text": "need", "b": false, "i": false}, {"text": "close", "b": true, "i": true}, {"text": "desert", "b": true, "i": true}, {"text": "inspection", "b": false, "i": false}], "rules": ["can be pronounced two different ways with different meanings", "contains exactly one pair of adjacent consonants"]}, {"clue": [{"text": "Patient", "b": true, "i": true}, {"text": "visitors", "b": false, "i": true}, {"text": "escape", "b": true, "i": false}, {"text": "crowded", "b": false, "i": false}, {"text": "libraries", "b": true, "i": true}, {"text": "whenever", "b": false, "i": false}, {"text": "possible", "b": false, "i": true}], "puzzle": [{"text": "Whatever", "b": true, "i": false}, {"text": "harvest", "b": true, "i": true}, {"text": "remains", "b": false, "i": true}, {"text": "skilled", "b": false, "i": false}, {"text": "crews", "b": false, "i": false}, {"text": "gather", "b": false, "i": true}, {"text": "outside", "b": false, "i": true}], "rules": ["contains a hidden item of clothing", "its second letter is a vowel"]}, {"clue": [{"text": "Careful", "b": false, "i": true}, {"text": "buyers", "b": false, "i": true}, {"text": "repaid", "b": true, "i": true}, {"text": "vendors", "b": false, "i": true}, {"text": "after", "b": false, "i": true}, {"text": "stressed", "b": true, "i": false}, {"text": "deliveries", "b": false, "i": false}], "puzzle": [{"text": "Designers", "b": false, "i": false}, {"text": "edit", "b": true, "i": true}, {"text": "drawer", "b": true, "i": true}, {"text": "labels", "b": false, "i": true}, {"text": "during", "b": false, "i": true}, {"text": "live", "b": true, "i": true}, {"text": "events", "b": false, "i": false}], "rules": ["spells another common word when read backwards", "none of its vowels are repeated"]}, {"clue": [{"text": "People", "b": false, "i": true}, {"text": "wonder", "b": true, "i": false}, {"text": "whether", "b": false, "i": false}, {"text": "consoles", "b": true, "i": true}, {"text": "realize", "b": true, "i": true}, {"text": "their", "b": false, "i": false}, {"text": "potential", "b": false, "i": false}], "puzzle": [{"text": "Cayenne", "b": true, "i": true}, {"text": "fumes", "b": false, "i": false}, {"text": "linger", "b": false, "i": false}, {"text": "compounds", "b": true, "i": false}, {"text": "leave", "b": false, "i": true}, {"text": "residue", "b": false, "i": true}, {"text": "elsewhere", "b": false, "i": true}], "rules": ["contains a hidden currency name", "its final letter appears earlier in the word"]}, {"clue": [{"text": "Team", "b": true, "i": true}, {"text": "leaders", "b": false, "i": false}, {"text": "deal", "b": true, "i": true}, {"text": "calmly", "b": false, "i": false}, {"text": "with", "b": false, "i": true}, {"text": "urgent", "b": false, "i": true}, {"text": "part", "b": true, "i": true}], "puzzle": [{"text": "Rail", "b": true, "i": true}, {"text": "agents", "b": false, "i": true}, {"text": "loop", "b": true, "i": false}, {"text": "cables", "b": false, "i": true}, {"text": "dear", "b": true, "i": true}, {"text": "guests", "b": false, "i": false}, {"text": "arrive", "b": false, "i": false}], "rules": ["becomes another common word when its first and last letters are swapped", "has no repeated letters"]}];

let levelIndex = 0;
let selectedIndex = null;
let checks = 0;
let state = [];
let scores = [];

const clueEl = document.getElementById('clue');
const sentenceEl = document.getElementById('sentence');
const progressEl = document.getElementById('progress');
const boldBtn = document.getElementById('boldBtn');
const italicBtn = document.getElementById('italicBtn');
const checkBtn = document.getElementById('checkBtn');
const resultEl = document.getElementById('result');
const scoreEl = document.getElementById('score');
const rulesEl = document.getElementById('rules');
const nextBtn = document.getElementById('nextBtn');
const gameEl = document.getElementById('game');
const finishedEl = document.getElementById('finished');
const finalScoresEl = document.getElementById('finalScores');

function formattedSpan(item){
  const span = document.createElement('span');
  span.textContent = item.text;
  if(item.b) span.style.fontWeight = '800';
  if(item.i) span.style.fontStyle = 'italic';
  return span;
}

function renderClue(){
  clueEl.innerHTML = '';
  const clue = LEVELS[levelIndex].clue;
  clue.forEach((item, idx) => {
    clueEl.appendChild(formattedSpan(item));
    clueEl.appendChild(document.createTextNode(idx === clue.length - 1 ? '.' : ' '));
  });
}

function renderSentence(){
  sentenceEl.innerHTML = '';
  const puzzle = LEVELS[levelIndex].puzzle;

  puzzle.forEach((item, idx) => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'word';
    btn.textContent = item.text;

    if(state[idx].b) btn.classList.add('user-b');
    if(state[idx].i) btn.classList.add('user-i');
    if(state[idx].locked) btn.classList.add('locked');
    if(idx === selectedIndex && !state[idx].locked) btn.classList.add('selected');

    btn.addEventListener('click', () => {
      if(state[idx].locked) return;
      selectedIndex = idx;
      renderSentence();
      renderToolbar();
    });

    sentenceEl.appendChild(btn);
    sentenceEl.appendChild(document.createTextNode(idx === puzzle.length - 1 ? '.' : ' '));
  });
}

function renderToolbar(){
  const usable = selectedIndex !== null && !state[selectedIndex].locked;
  boldBtn.disabled = !usable;
  italicBtn.disabled = !usable;
  boldBtn.classList.toggle('active', usable && state[selectedIndex].b);
  italicBtn.classList.toggle('active', usable && state[selectedIndex].i);
}

function loadLevel(){
  checks = 0;
  selectedIndex = null;
  state = LEVELS[levelIndex].puzzle.map(() => ({b:false, i:false, locked:false}));

  progressEl.textContent = `${levelIndex + 1} / ${LEVELS.length}`;
  resultEl.style.display = 'none';
  nextBtn.style.display = 'none';
  checkBtn.style.display = 'block';

  renderClue();
  renderSentence();
  renderToolbar();
}

boldBtn.addEventListener('click', () => {
  if(selectedIndex === null || state[selectedIndex].locked) return;
  state[selectedIndex].b = !state[selectedIndex].b;
  renderSentence();
  renderToolbar();
});

italicBtn.addEventListener('click', () => {
  if(selectedIndex === null || state[selectedIndex].locked) return;
  state[selectedIndex].i = !state[selectedIndex].i;
  renderSentence();
  renderToolbar();
});

checkBtn.addEventListener('click', () => {
  checks += 1;
  const puzzle = LEVELS[levelIndex].puzzle;

  puzzle.forEach((item, idx) => {
    if(state[idx].locked) return;
    if(state[idx].b === item.b && state[idx].i === item.i){
      state[idx].locked = true;
    }
  });

  if(selectedIndex !== null && state[selectedIndex].locked) selectedIndex = null;

  renderSentence();
  renderToolbar();

  if(state.every(x => x.locked)){
    scores[levelIndex] = checks;
    scoreEl.textContent = `Solved in ${checks} check${checks === 1 ? '' : 's'}`;

    const [boldRule, italicRule] = LEVELS[levelIndex].rules;
    rulesEl.innerHTML = `<b>Bold</b> = ${boldRule}<br><i>Italic</i> = ${italicRule}`;

    resultEl.style.display = 'block';
    checkBtn.style.display = 'none';
    nextBtn.style.display = 'block';
    nextBtn.textContent = levelIndex === LEVELS.length - 1 ? 'FINISH' : 'NEXT LEVEL';
  }
});

nextBtn.addEventListener('click', () => {
  if(levelIndex < LEVELS.length - 1){
    levelIndex += 1;
    loadLevel();
    window.scrollTo({top:0, behavior:'smooth'});
  } else {
    gameEl.style.display = 'none';
    progressEl.textContent = '5 / 5';
    finishedEl.style.display = 'block';
    finalScoresEl.textContent = scores
      .map((n, i) => `Level ${i+1}: ${n} check${n === 1 ? '' : 's'}`)
      .join('  ·  ');
  }
});

loadLevel();
</script>
</body>
</html>
