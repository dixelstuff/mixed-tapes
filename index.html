<style>
  *{box-sizing:border-box}

  #lines{position:absolute;left:0;top:0;pointer-events:none}
  #status{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);padding:10px 14px;border-radius:999px;background:rgba(30,31,32,.94);font-size:13px;z-index:10}
  #status.hidden{display:none}
</style>

    function heapPop(){
      if(!heap.length)return null;
      const first=heap[0],last=heap.pop();
      if(heap.length){
        let i=0;
        while(true){
          const l=i*2+1,r=l+1;
          if(l>=heap.length)break;
          let c=l;
          if(r<heap.length&&heap[r].t<heap[l].t)c=r;
          if(heap[c].t>=last.t)break;
          heap[i]=heap[c]; i=c;
        }
        heap[i]=last;
      }
      return first;
    }

    // Rich stencil = rounded growing edge.
    const dirs=[],seen=new Set();
    function gcd(a,b){while(b){const t=a%b;a=b;b=t;}return Math.abs(a)||1;}
    for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
      if(!dx&&!dy)continue;
      const g=gcd(Math.abs(dx),Math.abs(dy)),k=(dx/g)+','+(dy/g);
      if(seen.has(k))continue;
      seen.add(k);
      dirs.push([dx,dy,Math.hypot(dx,dy)]);
    }

    function clearSegment(x0,y0,x1,y1){
      const dx=x1-x0,dy=y1-y0,n=Math.max(Math.abs(dx),Math.abs(dy));
      for(let q=1;q<=n;q++){
        const x=Math.round(x0+dx*q/n),y=Math.round(y0+dy*q/n);
        if(x<0||y<0||x>=MW||y>=MH)return false;
        const i=y*MW+x;
        if(wall[i]||!intended[i])return false;
      }
      return true;
    }

    const SPEED=13;
    const clock0=performance.now()/1000;
    const best=(src,i)=>src.best.get(i)??Infinity;

    function schedule(i,sid,t){
      const src=sources[sid],x=i%MW,y=(i/MW)|0;
      for(const [dx,dy,cost] of dirs){
        const nx=x+dx,ny=y+dy;
        if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
        const ni=ny*MW+nx;
        if(wall[ni]||!intended[ni])continue;
        if(owner[ni]!==-1&&owner[ni]!==sid)continue;
        if(!clearSegment(x,y,nx,ny))continue;
        const nt=t+cost/SPEED;
        if(nt+1e-6<best(src,ni)){
          src.best.set(ni,nt);
          heapPush({i:ni,sid,t:nt});
        }
      }
    }

    function startFill(id,mx,my){
      if(!id||started[id])return;
      started[id]=1;

      let x=Math.max(1,Math.min(MW-2,Math.floor(mx)));
      let y=Math.max(1,Math.min(MH-2,Math.floor(my)));
      let i=y*MW+x;

      if(wall[i]||intended[i]!==id){
        search:
        for(let r=1;r<15;r++){
          for(let yy=-r;yy<=r;yy++)for(let xx=-r;xx<=r;xx++){
            const nx=x+xx,ny=y+yy;
            if(nx<1||ny<1||nx>=MW-1||ny>=MH-1)continue;
            const ni=ny*MW+nx;
            if(!wall[ni]&&intended[ni]===id){i=ni;break search;}
          }
        }
      }
      if(owner[i]!==-1)return;

      const sid=sources.length;
      const now=performance.now()/1000-clock0;
      const src={id,rgb:rgb(colors[id]),best:new Map()};
      sources.push(src);
      src.best.set(i,now);
      heapPush({i,sid,t:now});
    }

    function advance(now){
      let count=0;
      while(heap.length&&heap[0].t<=now&&count<10000){
        count++;
        const e=heapPop(),src=sources[e.sid];
        if(!src||Math.abs(best(src,e.i)-e.t)>.0001)continue;
        if(owner[e.i]!==-1){
          if(owner[e.i]!==e.sid)continue;
        }else{
          owner[e.i]=e.sid;
          const c=src.rgb,j=e.i*4;
          simImage.data[j]=c[0];simImage.data[j+1]=c[1];simImage.data[j+2]=c[2];simImage.data[j+3]=255;
          dirty=true;
        }
        schedule(e.i,e.sid,e.t);
      }
    }

    let lastBlit=0,lastStats=0;
    function draw(ms){
      if(dirty&&ms-lastBlit>32){
        lastBlit=ms; dirty=false;
        sctx.putImageData(simImage,0,0);
        fctx.fillStyle=paper; fctx.fillRect(0,0,W,H);
        fctx.imageSmoothingEnabled=true;
        fctx.drawImage(simCanvas,DX,DY,DS,DS);
      }
      if(ms-lastStats>180){
        lastStats=ms;
        let total=0,coloured=0,correct=0;
        for(let i=0;i<intended.length;i++){
          if(!intended[i]||wall[i])continue;
          total++;
          const sid=owner[i];
          if(sid>=0){
            coloured++;
            if(sources[sid].id===intended[i])correct++;
          }
        }
        completeEl.textContent=(total?100*coloured/total:0).toFixed(1)+'%';
        accuracyEl.textContent=(coloured?100*correct/coloured:100).toFixed(1)+'%';
      }
    }
    function loop(ms){
      advance(ms/1000-clock0);
      draw(ms);
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    status.classList.add('hidden');

    // Pan / pinch / tap.
    let zoom=1,panX=0,panY=0,last=null,start=null,moved=false,pinch=null;
    const pointers=new Map();

    function apply(){stage.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`;}
    function clamp(){
      const vr=view.getBoundingClientRect();
      const baseW=vr.width,baseH=baseW*(H/W);
      const sw=baseW*zoom,sh=baseH*zoom;
      panX=Math.max(Math.min(0,vr.width-sw),Math.min(0,panX));
      panY=Math.max(Math.min(0,vr.height-sh),Math.min(0,panY));
    }
    function world(x,y){
      const r=stage.getBoundingClientRect();
      return{x:(x-r.left)*(W/r.width),y:(y-r.top)*(H/r.height)};
    }
    function zoomAt(f,x,y){
      const before=world(x,y);
      const next=Math.max(1,Math.min(6,zoom*f));
      if(next===zoom)return;
      zoom=next;
      const vr=view.getBoundingClientRect(),baseScale=vr.width/W;
      panX=(x-vr.left)-before.x*baseScale*zoom;
      panY=(y-vr.top)-before.y*baseScale*zoom;
      clamp();apply();
    }

    view.addEventListener('pointerdown',e=>{
      view.setPointerCapture(e.pointerId);
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      start=last={x:e.clientX,y:e.clientY};
      moved=false;
      view.classList.add('dragging');
      if(pointers.size===2){
        const p=[...pointers.values()];
        pinch={d:Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y),z:zoom};
      }
    });

    view.addEventListener('pointermove',e=>{
      if(!pointers.has(e.pointerId))return;
      pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
      if(pointers.size===2){
        const p=[...pointers.values()];
        const d=Math.hypot(p[0].x-p[1].x,p[0].y-p[1].y);
        if(pinch){
          const target=Math.max(1,Math.min(6,pinch.z*d/pinch.d));
          zoomAt(target/zoom,(p[0].x+p[1].x)/2,(p[0].y+p[1].y)/2);
        }
        moved=true;
        return;
      }
      if(last){
        if(Math.hypot(e.clientX-start.x,e.clientY-start.y)>5)moved=true;
        if(moved){
          panX+=e.clientX-last.x;
          panY+=e.clientY-last.y;
          clamp();apply();
        }
        last={x:e.clientX,y:e.clientY};
      }
    });

    view.addEventListener('pointerup',e=>{
      if(!moved&&pointers.size===1){
        const p=world(e.clientX,e.clientY);
        if(p.x>=DX&&p.x<=DX+DS&&p.y>=DY&&p.y<=DY+DS){
          const mx=(p.x-DX)/DS*MW,my=(p.y-DY)/DS*MH;
          const x=Math.floor(mx),y=Math.floor(my);
          if(x>=0&&y>=0&&x<MW&&y<MH){
            const id=intended[y*MW+x];
            if(id)startFill(id,mx,my);
          }
        }
      }
      pointers.delete(e.pointerId);
      if(pointers.size<2)pinch=null;
      last=start=null;
      view.classList.remove('dragging');
    });

    view.addEventListener('pointercancel',e=>{
      pointers.delete(e.pointerId);
      if(pointers.size<2)pinch=null;
      view.classList.remove('dragging');
    });

    view.addEventListener('wheel',e=>{
      e.preventDefault();
      zoomAt(e.deltaY<0?1.12:.89,e.clientX,e.clientY);
    },{passive:false});

    apply();
  }catch(err){
    console.error(err);
    status.textContent='Could not initialise artwork: '+(err?.message||'unknown error');
  }
})();
</script>
</body>
</html>
