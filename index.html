<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TAPE — peel prototype v2</title>
<style>
:root{
  --bg:#0f1623;
  --text:#eef3fb;
  --muted:#9aa6b8;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{
  margin:0;height:100%;overflow:hidden;
  background:var(--bg);color:var(--text);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
body{display:flex;justify-content:center}
#app{
  width:min(100vw,560px);height:100dvh;
  display:flex;flex-direction:column;
  padding:env(safe-area-inset-top) 12px env(safe-area-inset-bottom);
}
header{
  height:64px;display:flex;align-items:center;justify-content:space-between;padding:0 3px;
}
.brand{font-size:14px;font-weight:800;letter-spacing:.22em}
.sub{font-size:12px;color:var(--muted);margin-top:4px}
button{
  border:0;border-radius:14px;background:#1d293b;color:#f4f7fb;
  padding:10px 14px;font:inherit;font-weight:700;
}
#stageWrap{flex:1;min-height:0;display:flex;align-items:stretch}
#stage{
  position:relative;flex:1;overflow:hidden;touch-action:none;
  border-radius:22px;
  background:var(--bg);
}
.tape{
  position:absolute;transform-origin:left center;
  border-radius:2px;
  box-shadow:0 3px 7px rgba(0,0,0,.24), inset 0 1px 0 rgba(255,255,255,.22);
  will-change:left,top,width,transform,opacity;
}
.tape:after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background:
    linear-gradient(180deg,rgba(255,255,255,.16),transparent 45%,rgba(0,0,0,.08)),
    repeating-linear-gradient(90deg,transparent 0 12px,rgba(255,255,255,.08) 13px 14px,transparent 15px 26px);
  opacity:.7;
}
.hit{
  position:absolute;width:58px;height:58px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:transparent;z-index:5000;touch-action:none;
}
.curl{
  position:absolute;width:30px;height:20px;border-radius:50%;
  transform:translate(-50%,-50%);pointer-events:none;z-index:4900;
  box-shadow:inset -6px 0 9px rgba(0,0,0,.28),0 4px 7px rgba(0,0,0,.25);
}
#toast{
  position:absolute;left:50%;top:14px;transform:translateX(-50%) translateY(-8px);
  padding:8px 12px;border-radius:999px;background:rgba(20,29,43,.9);
  font-size:12px;font-weight:700;opacity:0;transition:.18s;pointer-events:none;z-index:9000;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#finish{
  position:absolute;inset:0;background:rgba(15,22,35,.76);backdrop-filter:blur(7px);
  display:flex;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:.28s;z-index:10000;
}
#finish.show{opacity:1;pointer-events:auto}
.card{
  text-align:center;padding:22px 24px;border-radius:22px;background:#182235;
  box-shadow:0 20px 50px rgba(0,0,0,.3)
}
.card .big{font-size:30px;font-weight:800;margin-bottom:5px}
.card .small{font-size:13px;color:#aeb9c9;margin-bottom:14px}
footer{
  height:74px;display:flex;align-items:center;justify-content:space-between;padding:4px 2px 0;gap:10px
}
#status{font-size:13px;line-height:1.35;color:#aeb8c7}
#status b{color:#fff}
@media(max-height:700px){
  header{height:54px}.sub{display:none}footer{height:60px}
}
</style>
</head>
<body>
<div id="app">
  <header>
    <div>
      <div class="brand">TAPE</div>
      <div class="sub">drag a loose end and peel</div>
    </div>
    <button id="newBtn">New board</button>
  </header>

  <div id="stageWrap">
    <div id="stage">
      <div id="toast"></div>
      <div id="finish">
        <div class="card">
          <div class="big">clean.</div>
          <div class="small">all tape removed</div>
          <button id="againBtn">Again</button>
        </div>
      </div>
    </div>
  </div>

  <footer>
    <div id="status"><b>Drag a tape end.</b><br>It stops when a higher layer pins it.</div>
    <button id="undoBtn">Undo</button>
  </footer>
</div>

<script>
(() => {
  const stage = document.getElementById('stage');
  const status = document.getElementById('status');
  const toast = document.getElementById('toast');
  const finish = document.getElementById('finish');
  const newBtn = document.getElementById('newBtn');
  const againBtn = document.getElementById('againBtn');
  const undoBtn = document.getElementById('undoBtn');

  const COLORS = ['#ef5b5b','#f0bb43','#4b9fe0','#5fbe84','#9b73d5','#e784b7','#ef8a4c','#54c4bc'];
  let strips = [];
  let crossings = [];
  let history = [];
  let drag = null;

  const rand=(a,b)=>a+Math.random()*(b-a);
  const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  const hypot=Math.hypot;

  function geom(s){
    const w=stage.clientWidth,h=stage.clientHeight;
    const x1=s.ax*w,y1=s.ay*h,x2=s.bx*w,y2=s.by*h;
    const dx=x2-x1,dy=y2-y1,L=hypot(dx,dy);
    return {x1,y1,x2,y2,dx,dy,L,ux:dx/L,uy:dy/L};
  }
  function pointOn(s,t){
    const g=geom(s);
    return {x:g.x1+g.dx*t,y:g.y1+g.dy*t};
  }

  function lineIntersection(a,b){
    const p={x:a.ax,y:a.ay}, r={x:a.bx-a.ax,y:a.by-a.ay};
    const q={x:b.ax,y:b.ay}, s={x:b.bx-b.ax,y:b.by-b.ay};
    const cross=(u,v)=>u.x*v.y-u.y*v.x;
    const d=cross(r,s);
    if(Math.abs(d)<1e-8)return null;
    const qp={x:q.x-p.x,y:q.y-p.y};
    const ta=cross(qp,s)/d, tb=cross(qp,r)/d;
    if(ta>.04&&ta<.96&&tb>.04&&tb<.96)return {ta,tb};
    return null;
  }

  function build(){
    finish.classList.remove('show');
    history=[];drag=null;
    [...stage.querySelectorAll('.tape,.hit,.curl')].forEach(el=>el.remove());
    strips=[];crossings=[];

    const count = stage.clientWidth < 420 ? 14 : 17;
    const horiz = Math.round(count*.52);

    // Each strip receives ONE true physical layer.
    // Higher layer value = visually and mechanically on top everywhere.
    const layers=[...Array(count).keys()];
    for(let i=layers.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      [layers[i],layers[j]]=[layers[j],layers[i]];
    }

    for(let i=0;i<count;i++){
      const horizontal=i<horiz;
      let ax,ay,bx,by;
      if(horizontal){
        ay=rand(.06,.94); by=clamp(ay+rand(-.035,.035),.03,.97);
        ax=rand(-.09,-.015); bx=rand(1.015,1.09);
      }else{
        ax=rand(.05,.95); bx=clamp(ax+rand(-.035,.035),.03,.97);
        ay=rand(-.08,-.01); by=rand(1.01,1.08);
      }

      const s={
        id:i,layer:layers[i],
        ax,ay,bx,by,
        width:rand(21,31),
        color:COLORS[i%COLORS.length],
        leftPeel:0,rightPeel:0,removed:false
      };
      strips.push(s);
    }

    for(let i=0;i<count;i++){
      for(let j=i+1;j<count;j++){
        const hit=lineIntersection(strips[i],strips[j]);
        if(hit){
          crossings.push({a:i,b:j,ta:hit.ta,tb:hit.tb});
        }
      }
    }

    strips.forEach(createEls);
    render();
  }

  function createEls(s){
    const tape=document.createElement('div');
    tape.className='tape';
    tape.style.background=s.color;
    tape.style.zIndex=100+s.layer;
    stage.appendChild(tape);
    s.el=tape;

    const lh=document.createElement('div'), rh=document.createElement('div');
    lh.className=rh.className='hit';
    lh.dataset.id=rh.dataset.id=s.id;
    lh.dataset.side='left';rh.dataset.side='right';
    stage.appendChild(lh);stage.appendChild(rh);
    s.lh=lh;s.rh=rh;

    const lc=document.createElement('div'),rc=document.createElement('div');
    lc.className=rc.className='curl';
    stage.appendChild(lc);stage.appendChild(rc);
    s.lc=lc;s.rc=rc;

    [lh,rh].forEach(el=>el.addEventListener('pointerdown',startDrag,{passive:false}));
  }

  function isOtherPresent(otherId,t){
    const o=strips[otherId];
    if(o.removed)return false;
    return t > o.leftPeel+.002 && t < 1-o.rightPeel-.002;
  }

  function blockingCrossings(s){
    const out=[];
    for(const c of crossings){
      let selfT=null, otherId=null, otherT=null;
      if(c.a===s.id){selfT=c.ta;otherId=c.b;otherT=c.tb}
      else if(c.b===s.id){selfT=c.tb;otherId=c.a;otherT=c.ta}
      else continue;

      const o=strips[otherId];

      // Mechanical rule exactly matches visual rule:
      // only a strip on a higher global layer can pin this strip.
      if(o.layer > s.layer && isOtherPresent(otherId,otherT)){
        out.push(selfT);
      }
    }
    return out;
  }

  function peelLimit(s,side){
    const curL=s.leftPeel;
    const curR=1-s.rightPeel;
    const blockers=blockingCrossings(s);

    if(side==='left'){
      const ahead=blockers.filter(t=>t>curL+.002 && t<curR-.002);
      return ahead.length ? Math.min(...ahead) : curR;
    }else{
      const ahead=blockers.filter(t=>t<curR-.002 && t>curL+.002);
      return ahead.length ? Math.max(...ahead) : curL;
    }
  }

  function available(s,side){
    const cur=side==='left'?s.leftPeel:1-s.rightPeel;
    return Math.abs(peelLimit(s,side)-cur)>.004;
  }

  function snapshot(){
    return strips.map(s=>({leftPeel:s.leftPeel,rightPeel:s.rightPeel,removed:s.removed}));
  }

  function startDrag(e){
    e.preventDefault();
    const el=e.currentTarget;
    const s=strips[+el.dataset.id];
    const side=el.dataset.side;
    if(s.removed||!available(s,side))return;

    history.push(snapshot());
    if(history.length>40)history.shift();

    const g=geom(s);
    const startT=side==='left'?s.leftPeel:1-s.rightPeel;
    const limit=peelLimit(s,side);

    drag={pid:e.pointerId,s,side,g,startT,limit,lastT:startT};
    el.setPointerCapture?.(e.pointerId);
    el.addEventListener('pointermove',moveDrag,{passive:false});
    el.addEventListener('pointerup',endDrag,{passive:false,once:true});
    el.addEventListener('pointercancel',endDrag,{passive:false,once:true});
  }

  function moveDrag(e){
    if(!drag||e.pointerId!==drag.pid)return;
    e.preventDefault();

    const r=stage.getBoundingClientRect();
    const x=e.clientX-r.left,y=e.clientY-r.top;
    const g=drag.g;
    const proj=((x-g.x1)*g.dx+(y-g.y1)*g.dy)/(g.L*g.L);

    let t;
    if(drag.side==='left'){
      t=clamp(proj,drag.startT,drag.limit);
      drag.s.leftPeel=t;
    }else{
      t=clamp(proj,drag.limit,drag.startT);
      drag.s.rightPeel=1-t;
    }
    drag.lastT=t;
    render();
  }

  function endDrag(e){
    if(!drag)return;
    const {s,side,startT,limit,lastT}=drag;
    const moved=Math.abs(lastT-startT);
    const reached=Math.abs(lastT-limit)<.02;

    if(moved<.015){
      if(side==='left') s.leftPeel=Math.min(limit,s.leftPeel+.08);
      else s.rightPeel=Math.min(1-limit,s.rightPeel+.08);
    }else if(reached){
      if(side==='left')s.leftPeel=limit;
      else s.rightPeel=1-limit;
    }

    if(s.leftPeel+s.rightPeel>=.992){
      s.removed=true;
      if(navigator.vibrate)navigator.vibrate(12);
      showToast('free');
    }else if(reached){
      if(navigator.vibrate)navigator.vibrate(6);
    }

    drag=null;
    render();
    checkFinish();
  }

  function render(){
    for(const s of strips){
      if(s.removed){
        s.el.style.opacity='0';
        s.lh.style.display=s.rh.style.display=s.lc.style.display=s.rc.style.display='none';
        continue;
      }

      const t0=s.leftPeel,t1=1-s.rightPeel;
      const p0=pointOn(s,t0),p1=pointOn(s,t1);
      const len=hypot(p1.x-p0.x,p1.y-p0.y);
      const ang=Math.atan2(p1.y-p0.y,p1.x-p0.x)*180/Math.PI;

      s.el.style.opacity='1';
      s.el.style.left=p0.x+'px';
      s.el.style.top=(p0.y-s.width/2)+'px';
      s.el.style.width=Math.max(0,len)+'px';
      s.el.style.height=s.width+'px';
      s.el.style.transform=`rotate(${ang}deg)`;

      placeHit(s.lh,p0,available(s,'left'));
      placeHit(s.rh,p1,available(s,'right'));

      placeCurl(s.lc,p0,s,s.leftPeel>.01);
      placeCurl(s.rc,p1,s,s.rightPeel>.01);
    }

    const remaining=strips.filter(s=>!s.removed).length;
    const partial=strips.filter(s=>!s.removed&&(s.leftPeel>.015||s.rightPeel>.015)).length;
    status.innerHTML=`<b>${remaining} strip${remaining===1?'':'s'} left</b><br>${partial?partial+' partly peeled':'Drag any exposed end'}`;
    undoBtn.disabled=!history.length;
    undoBtn.style.opacity=history.length?1:.4;
  }

  function placeHit(el,p,on){
    el.style.display=on?'block':'none';
    el.style.left=p.x+'px';
    el.style.top=p.y+'px';
  }

  function placeCurl(el,p,s,on){
    el.style.display=on?'block':'none';
    el.style.left=p.x+'px';
    el.style.top=p.y+'px';
    el.style.background=`radial-gradient(circle at 35% 50%,rgba(255,255,255,.46) 0 12%,${s.color} 20% 58%,rgba(25,25,25,.3) 60% 69%,${s.color} 71%)`;
  }

  function restore(snap){
    strips.forEach((s,i)=>Object.assign(s,snap[i]));
    finish.classList.remove('show');
    render();
  }

  function showToast(txt){
    toast.textContent=txt;
    toast.classList.add('show');
    clearTimeout(showToast.t);
    showToast.t=setTimeout(()=>toast.classList.remove('show'),500);
  }

  function checkFinish(){
    if(strips.every(s=>s.removed)){
      setTimeout(()=>finish.classList.add('show'),220);
      if(navigator.vibrate)navigator.vibrate([16,36,16]);
    }
  }

  newBtn.addEventListener('click',build);
  againBtn.addEventListener('click',build);
  undoBtn.addEventListener('click',()=>{
    if(history.length)restore(history.pop());
  });
  window.addEventListener('resize',()=>render());

  requestAnimationFrame(build);
})();
</script>
</body>
</html>
