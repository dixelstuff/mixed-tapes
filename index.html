<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>TAPE — fixed local contacts v12</title>
<style>
:root{--bg:#0f1623;--text:#eef3fb;--muted:#9aa6b8}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--text);
font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
body{display:flex;justify-content:center}
#app{width:min(100vw,650px);height:100dvh;display:flex;flex-direction:column;
padding:env(safe-area-inset-top) 10px env(safe-area-inset-bottom)}
header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:0 4px}
.brand{font-size:14px;font-weight:800;letter-spacing:.17em}.sub{font-size:12px;color:var(--muted);margin-top:4px}
button{border:0;border-radius:14px;background:#1d293b;color:#f4f7fb;padding:10px 14px;font:inherit;font-weight:700}
#viewport{position:relative;flex:1;min-height:0;overflow:hidden;border-radius:20px;touch-action:none;background:var(--bg)}
#world{position:absolute;left:0;top:0;width:1200px;height:1600px;transform-origin:0 0}
.tape,.contactPatch{position:absolute;transform-origin:left center;border-radius:3px;pointer-events:none;
box-shadow:0 4px 9px rgba(0,0,0,.27),inset 0 1px 0 rgba(255,255,255,.18)}
.tape:after,.contactPatch:after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.72;
background:linear-gradient(180deg,rgba(255,255,255,.16),transparent 46%,rgba(0,0,0,.09)),
repeating-linear-gradient(90deg,transparent 0 15px,rgba(255,255,255,.07) 16px 17px,transparent 18px 31px)}
.contactPatch{z-index:3000;box-shadow:0 3px 7px rgba(0,0,0,.22),inset 0 1px 0 rgba(255,255,255,.2)}
.roll{position:absolute;width:44px;height:28px;border-radius:50%;transform:translate(-50%,-50%);
pointer-events:none;z-index:9000;opacity:0;box-shadow:inset -9px 0 12px rgba(0,0,0,.34),0 5px 10px rgba(0,0,0,.3)}
#hud{position:absolute;left:12px;top:12px;z-index:9500;background:rgba(18,26,40,.78);backdrop-filter:blur(8px);
padding:8px 10px;border-radius:12px;font-size:12px;color:#d7deea}
footer{height:72px;display:flex;align-items:center;justify-content:space-between;padding:4px 2px 0;gap:10px}
#status{font-size:13px;line-height:1.35;color:#aeb8c7}#status b{color:white}
#finish{position:absolute;inset:0;background:rgba(15,22,35,.82);backdrop-filter:blur(7px);display:flex;
align-items:center;justify-content:center;opacity:0;pointer-events:none;transition:.25s;z-index:10000}
#finish.show{opacity:1;pointer-events:auto}.card{background:#182235;border-radius:22px;padding:22px 24px;text-align:center}
.big{font-size:30px;font-weight:800;margin-bottom:6px}.small{font-size:13px;color:#aeb9c9;margin-bottom:14px}
@media(max-height:700px){header{height:52px}.sub{display:none}footer{height:60px}}
</style>
</head>
<body>
<div id="app">
<header>
 <div><div class="brand">TAPE · V12</div><div class="sub">fixed over/under at every real overlap</div></div>
 <button id="newBtn">New board</button>
</header>
<div id="viewport">
 <div id="world"></div>
 <div id="hud">tap a genuinely free end · pinch to zoom · drag to pan</div>
 <div id="finish"><div class="card"><div class="big">clean.</div><div class="small" id="finishText"></div><button id="againBtn">Again</button></div></div>
</div>
<footer>
 <div id="status"><b>Building board…</b><br>Contacts need ≥ half-width overlap.</div>
 <button id="undoBtn">Undo</button>
</footer>
</div>
<script>
(()=>{
const viewport=document.getElementById('viewport'),world=document.getElementById('world'),
status=document.getElementById('status'),finish=document.getElementById('finish'),finishText=document.getElementById('finishText'),
newBtn=document.getElementById('newBtn'),againBtn=document.getElementById('againBtn'),undoBtn=document.getElementById('undoBtn');

const WW=1200,WH=1600,N=30,STUB=.010;
const COLORS=['#ef5b5b','#f0bb43','#4b9fe0','#5fbe84','#9b73d5','#e784b7','#ef8a4c','#54c4bc'];
let strips=[],contacts=[],history=[],tapCount=0,optimal=null,optimalPartial=0,animating=false,animVisual=null;
let view={scale:.5,tx:0,ty:0},pointers=new Map(),gesture=null,tapCandidate=null;

const rand=(a,b)=>a+Math.random()*(b-a),clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),hypot=Math.hypot;

function applyView(){world.style.transform=`translate(${view.tx}px,${view.ty}px) scale(${view.scale})`}
function fitWorld(){const vw=viewport.clientWidth,vh=viewport.clientHeight,s=Math.min(vw/WW,vh/WH)*.96;
 view.scale=s;view.tx=(vw-WW*s)/2;view.ty=(vh-WH*s)/2;applyView()}
function screenToWorld(x,y){const r=viewport.getBoundingClientRect();return{x:(x-r.left-view.tx)/view.scale,y:(y-r.top-view.ty)/view.scale}}

function makeStrip(i){
 const type=i%3,margin=105;
 if(type===0){
   const y=rand(margin,WH-margin),y2=clamp(y+rand(-55,55),margin,WH-margin);
   return{id:i,ax:rand(margin,260),ay:y,bx:rand(WW-260,WW-margin),by:y2,width:rand(52,70),color:COLORS[i%COLORS.length],a:0,b:1,removed:false,el:null,roll:null};
 }
 if(type===1){
   const x=rand(margin,WW-margin),x2=clamp(x+rand(-55,55),margin,WW-margin);
   return{id:i,ax:x,ay:rand(margin,260),bx:x2,by:rand(WH-260,WH-margin),width:rand(52,70),color:COLORS[i%COLORS.length],a:0,b:1,removed:false,el:null,roll:null};
 }
 const x1=rand(margin,320),x2=rand(WW-320,WW-margin);
 const down=Math.random()<.5;
 return{id:i,ax:x1,ay:down?rand(margin,420):rand(WH-420,WH-margin),
   bx:x2,by:down?rand(WH-420,WH-margin):rand(margin,420),width:rand(52,70),color:COLORS[i%COLORS.length],a:0,b:1,removed:false,el:null,roll:null};
}
function geom(s){const dx=s.bx-s.ax,dy=s.by-s.ay,L=hypot(dx,dy);return{x1:s.ax,y1:s.ay,x2:s.bx,y2:s.by,dx,dy,L,ux:dx/L,uy:dy/L}}
function pointOn(s,t){return{x:s.ax+(s.bx-s.ax)*t,y:s.ay+(s.by-s.ay)*t}}
function tapePolygon(s){
 const g=geom(s),nx=-g.uy*s.width/2,ny=g.ux*s.width/2;
 return[{x:g.x1+nx,y:g.y1+ny},{x:g.x2+nx,y:g.y2+ny},{x:g.x2-nx,y:g.y2-ny},{x:g.x1-nx,y:g.y1-ny}]
}
function signedArea(poly){let a=0;for(let i=0;i<poly.length;i++){const p=poly[i],q=poly[(i+1)%poly.length];a+=p.x*q.y-q.x*p.y}return a/2}
function polygonArea(poly){return Math.abs(signedArea(poly))}
function clipPolygon(subject,clip){
 let output=subject.slice(),sign=signedArea(clip)>=0?1:-1;
 for(let j=0;j<clip.length;j++){
   const A=clip[j],B=clip[(j+1)%clip.length],input=output;output=[];if(!input.length)break;
   const inside=P=>sign*((B.x-A.x)*(P.y-A.y)-(B.y-A.y)*(P.x-A.x))>=-1e-8;
   const intersect=(P,Q)=>{const rx=Q.x-P.x,ry=Q.y-P.y,sx=B.x-A.x,sy=B.y-A.y,den=rx*sy-ry*sx;if(Math.abs(den)<1e-10)return Q;
     const t=((A.x-P.x)*sy-(A.y-P.y)*sx)/den;return{x:P.x+t*rx,y:P.y+t*ry}};
   let S=input[input.length-1];
   for(const E of input){const ei=inside(E),si=inside(S);if(ei){if(!si)output.push(intersect(S,E));output.push(E)}else if(si)output.push(intersect(S,E));S=E}
 }
 return output
}
function projectAlong(poly,s){
 const g=geom(s),d=g.dx*g.dx+g.dy*g.dy,ts=poly.map(p=>((p.x-g.x1)*g.dx+(p.y-g.y1)*g.dy)/d);
 return[clamp(Math.min(...ts),0,1),clamp(Math.max(...ts),0,1)]
}
function normalExtent(poly,s){
 const g=geom(s),nx=-g.uy,ny=g.ux,vals=poly.map(p=>p.x*nx+p.y*ny);
 return Math.max(...vals)-Math.min(...vals)
}
function pointInPoly(p,poly){
 let inside=false;
 for(let i=0,j=poly.length-1;i<poly.length;j=i++){
   const a=poly[i],b=poly[j];
   const cross=((a.y>p.y)!=(b.y>p.y)) && (p.x < (b.x-a.x)*(p.y-a.y)/(b.y-a.y+1e-12)+a.x);
   if(cross)inside=!inside;
 }
 return inside
}

function makeContacts(){
 contacts=[];
 for(let i=0;i<strips.length;i++)for(let j=i+1;j<strips.length;j++){
   const a=strips[i],b=strips[j],inter=clipPolygon(tapePolygon(a),tapePolygon(b));
   if(inter.length<3||polygonArea(inter)<2)continue;

   // Critical ambiguity filter: the actual intersection must penetrate
   // at least HALF THE WIDTH across BOTH tapes' thickness directions.
   const penA=normalExtent(inter,a),penB=normalExtent(inter,b);
   if(penA < .5*a.width || penB < .5*b.width)continue;

   const spanA=projectAlong(inter,a),spanB=projectAlong(inter,b);
   if((spanA[1]-spanA[0])*geom(a).L<.5*Math.min(a.width,b.width))continue;
   if((spanB[1]-spanB[0])*geom(b).L<.5*Math.min(a.width,b.width))continue;

   // Fixed LOCAL hierarchy. It is immutable for this contact, but need not
   // be the same ordering at another contact.
   const aUpper=Math.random()<.5;
   contacts.push({
     upper:aUpper?a.id:b.id,
     lower:aUpper?b.id:a.id,
     upperSpan:aUpper?spanA:spanB,
     lowerSpan:aUpper?spanB:spanA,
     poly:inter,
     patch:null
   });
 }
}

function createVisuals(){
 for(const s of strips){
   const el=document.createElement('div');el.className='tape';el.style.background=s.color;el.style.zIndex=100;world.appendChild(el);s.el=el;
   const roll=document.createElement('div');roll.className='roll';
   roll.style.background=`radial-gradient(circle at 36% 50%,rgba(255,255,255,.5) 0 12%,${s.color} 20% 58%,rgba(20,20,20,.32) 60% 69%,${s.color} 71%)`;
   world.appendChild(roll);s.roll=roll;
 }
 for(const c of contacts){
   const p=document.createElement('div');p.className='contactPatch';p.style.background=strips[c.upper].color;world.appendChild(p);c.patch=p;
 }
}
function overlap1(a,b){return Math.max(0,Math.min(a[1],b[1])-Math.max(a[0],b[0]))}
function activeContact(c,state=null){
 const s=state?state[c.upper]:strips[c.upper];
 if(s.removed)return false;
 return overlap1([s.a,s.b],c.upperSpan)>1e-6;
}
function activeZonesFor(id,state=null){
 return contacts.filter(c=>c.lower===id&&activeContact(c,state)).map(c=>c.lowerSpan.slice()).sort((a,b)=>a[0]-b[0])
}
function mergeZones(zs){
 const out=[];for(const z of zs){if(!out.length||z[0]>out[out.length-1][1]+1e-6)out.push(z.slice());else out[out.length-1][1]=Math.max(out[out.length-1][1],z[1])}return out
}
function zoneContains(z,t){return t>=z[0]-1e-6&&t<=z[1]+1e-6}

function freeComponents(s,state=null){
 const ss=state?state[s.id]:s,zs=mergeZones(activeZonesFor(s.id,state).filter(z=>overlap1(z,[ss.a,ss.b])>1e-6)
   .map(z=>[Math.max(z[0],ss.a),Math.min(z[1],ss.b)]));
 const leftPinned=zs.some(z=>zoneContains(z,ss.a));
 const rightPinned=zs.some(z=>zoneContains(z,ss.b));
 let leftEnd=ss.b,rightStart=ss.a;
 if(!leftPinned){const z=zs.find(z=>z[0]>ss.a+1e-6);leftEnd=z?z[0]:ss.b}
 if(!rightPinned){for(let i=zs.length-1;i>=0;i--){if(zs[i][1]<ss.b-1e-6){rightStart=zs[i][1];break}}}
 return{zs,leftPinned,rightPinned,leftComp:leftPinned?null:[ss.a,leftEnd],rightComp:rightPinned?null:[rightStart,ss.b]}
}
function accessAt(s,t,state=null){
 const ss=state?state[s.id]:s,fc=freeComponents(s,state);
 const inL=fc.leftComp && t>=fc.leftComp[0]-1e-6&&t<=fc.leftComp[1]+1e-6;
 const inR=fc.rightComp && t>=fc.rightComp[0]-1e-6&&t<=fc.rightComp[1]+1e-6;
 if(!inL&&!inR)return null;
 if(inL&&inR){
   const dl=t-ss.a,dr=ss.b-t;
   if(dl<=dr)return{side:'left',from:ss.a,to:fc.leftComp[1],partial:fc.leftComp[1]<ss.b-1e-6};
   return{side:'right',from:ss.b,to:fc.rightComp[0],partial:fc.rightComp[0]>ss.a+1e-6};
 }
 if(inL)return{side:'left',from:ss.a,to:fc.leftComp[1],partial:fc.leftComp[1]<ss.b-1e-6};
 return{side:'right',from:ss.b,to:fc.rightComp[0],partial:fc.rightComp[0]>ss.a+1e-6};
}
function snapshot(){return{state:strips.map(s=>({a:s.a,b:s.b,removed:s.removed})),tapCount}}

function commitMove(s,a){
 if(a.side==='left'){
   if(a.partial)s.a=clamp(a.to-STUB,s.a,s.b);else{s.a=s.b;s.removed=true}
 }else{
   if(a.partial)s.b=clamp(a.to+STUB,s.a,s.b);else{s.b=s.a;s.removed=true}
 }
 if(s.b-s.a<.002)s.removed=true;
}

function stateKey(st){return st.map(s=>`${s.a.toFixed(4)},${s.b.toFixed(4)},${s.removed?1:0}`).join('|')}
function possibleMoves(st){
 const ms=[];
 for(let id=0;id<st.length;id++){
   const ss=st[id];if(ss.removed)continue;
   const fake={id};
   const fc=freeComponents(fake,st);
   if(fc.leftComp){
     const to=fc.leftComp[1],partial=to<ss.b-1e-6;
     ms.push({id,side:'left',to,partial});
   }
   if(fc.rightComp){
     const to=fc.rightComp[0],partial=to>ss.a+1e-6;
     if(!(fc.leftComp&&!partial&&fc.leftComp[1]>=ss.b-1e-6))ms.push({id,side:'right',to,partial});
   }
 }
 return ms;
}
function applyMove(st,m){
 const ns=st.map(s=>({...s})),s=ns[m.id];
 if(m.side==='left'){if(m.partial)s.a=clamp(m.to-STUB,s.a,s.b);else{s.a=s.b;s.removed=true}}
 else{if(m.partial)s.b=clamp(m.to+STUB,s.a,s.b);else{s.b=s.a;s.removed=true}}
 if(s.b-s.a<.002)s.removed=true;return ns
}
function solved(st){return st.every(s=>s.removed)}
function solveExact(){
 const start=strips.map(s=>({a:0,b:1,removed:false})),base=N;
 let bound=base,expanded=0;
 function dfs(st,g,b,memo,path){
   expanded++;if(expanded>220000)return{abort:true};
   const rem=st.reduce((n,s)=>n+(s.removed?0:1),0),f=g+rem;if(f>b)return{next:f};
   if(solved(st))return{found:true,path:path.slice()};
   const key=stateKey(st);if(memo.has(key)&&memo.get(key)<=g)return{next:Infinity};memo.set(key,g);
   const moves=possibleMoves(st).sort((x,y)=>(x.partial?1:0)-(y.partial?1:0));
   let next=Infinity;
   for(const m of moves){
     path.push(m);const r=dfs(applyMove(st,m),g+1,b,memo,path);path.pop();
     if(r.found||r.abort)return r;if(r.next<next)next=r.next;
   }
   return{next};
 }
 while(bound<=N+8){
   expanded=0;const r=dfs(start,0,bound,new Map(),[]);
   if(r.found)return{taps:r.path.length,partial:r.path.filter(m=>m.partial).length,path:r.path};
   if(r.abort)return null;if(!isFinite(r.next))return null;bound=r.next;
 }
 return null;
}

function grade(actual,opt){
 const r=actual/opt;if(r<=1.10)return'Excellent';if(r<=1.25)return'Great';if(r<=1.50)return'Good';if(r<=2)return'Okay';return'Completed'
}

function render(){
 for(const s of strips){
   let a=s.a,b=s.b;
   if(animVisual&&animVisual.id===s.id){if(animVisual.side==='left')a=animVisual.cur;else b=animVisual.cur}
   if(s.removed&&!animVisual){s.el.style.display='none';continue}
   s.el.style.display='block';
   const p0=pointOn(s,a),p1=pointOn(s,b),len=hypot(p1.x-p0.x,p1.y-p0.y),ang=Math.atan2(p1.y-p0.y,p1.x-p0.x)*180/Math.PI;
   s.el.style.left=p0.x+'px';s.el.style.top=(p0.y-s.width/2)+'px';s.el.style.width=len+'px';s.el.style.height=s.width+'px';s.el.style.transform=`rotate(${ang}deg)`;
 }
 for(const c of contacts){
   const up=strips[c.upper],active=activeContact(c);
   if(!active){c.patch.style.display='none';continue}
   const lo=Math.max(up.a,c.upperSpan[0]),hi=Math.min(up.b,c.upperSpan[1]);
   if(hi-lo<1e-5){c.patch.style.display='none';continue}
   c.patch.style.display='block';
   const p0=pointOn(up,lo),p1=pointOn(up,hi),len=hypot(p1.x-p0.x,p1.y-p0.y),ang=Math.atan2(p1.y-p0.y,p1.x-p0.x)*180/Math.PI;
   c.patch.style.left=p0.x+'px';c.patch.style.top=(p0.y-up.width/2)+'px';c.patch.style.width=len+'px';c.patch.style.height=up.width+'px';c.patch.style.transform=`rotate(${ang}deg)`;
 }
 const rem=strips.filter(s=>!s.removed).length,act=contacts.filter(c=>activeContact(c)).length;
 status.innerHTML=`<b>${rem} tapes left</b><br>${act} active contacts · taps ${tapCount}${optimal?' / minimum '+optimal:''}`;
 undoBtn.disabled=!history.length||animating;undoBtn.style.opacity=history.length&&!animating?1:.4;
}
function pointSegHit(p,s){
 const p0=pointOn(s,s.a),p1=pointOn(s,s.b),vx=p1.x-p0.x,vy=p1.y-p0.y,wx=p.x-p0.x,wy=p.y-p0.y,vv=vx*vx+vy*vy;
 let u=vv?((wx*vx+wy*vy)/vv):0;u=clamp(u,0,1);const qx=p0.x+vx*u,qy=p0.y+vy*u;
 return{dist:hypot(p.x-qx,p.y-qy),t:s.a+(s.b-s.a)*u}
}
function pickTape(p){
 const infos=strips.filter(s=>!s.removed).map(s=>({s,...pointSegHit(p,s)}));
 const strict=infos.filter(x=>x.dist<=x.s.width/2);
 if(strict.length===1)return strict[0];
 if(strict.length>1){
   // Apply over/under priority ONLY if tap is actually inside a stored contact polygon.
   const here=contacts.filter(c=>activeContact(c)&&pointInPoly(p,c.poly));
   if(here.length){
     const uppers=new Set(here.map(c=>c.upper));
     const chosen=strict.find(x=>uppers.has(x.s.id));
     if(chosen)return chosen;
   }
   strict.sort((a,b)=>a.dist-b.dist);return strict[0];
 }
 const slop=5/view.scale,near=infos.filter(x=>x.dist<=x.s.width/2+slop).sort((a,b)=>a.dist-b.dist);
 return near[0]||null
}

async function tapPeel(target){
 const s=target.s,a=accessAt(s,target.t);if(!a){if(navigator.vibrate)navigator.vibrate(4);return}
 history.push(snapshot());tapCount++;animating=true;
 const start=a.from,end=a.to,t0=performance.now(),dur=320+Math.min(650,Math.abs(end-start)*950);s.roll.style.opacity='1';
 await new Promise(resolve=>{
   function frame(now){const p=clamp((now-t0)/dur,0,1),e=1-Math.pow(1-p,3),cur=start+(end-start)*e,rp=pointOn(s,cur);
     animVisual={id:s.id,side:a.side,cur};s.roll.style.left=rp.x+'px';s.roll.style.top=rp.y+'px';
     s.roll.style.transform=`translate(-50%,-50%) scale(${1+.25*Math.sin(p*Math.PI)})`;render();
     if(p<1)requestAnimationFrame(frame);else resolve()}
   requestAnimationFrame(frame)
 });
 animVisual=null;commitMove(s,a);s.roll.style.opacity='0';animating=false;render();
 if(strips.every(s=>s.removed)){const g=grade(tapCount,optimal);finishText.textContent=`${g} · ${tapCount} taps · minimum ${optimal}`;setTimeout(()=>finish.classList.add('show'),180)}
}

async function build(){
 history=[];tapCount=0;optimal=null;optimalPartial=0;animating=false;animVisual=null;pointers.clear();finish.classList.remove('show');
 let attempt=0,sol=null;
 do{
   attempt++;world.innerHTML='';strips=[];contacts=[];
   for(let i=0;i<N;i++)strips.push(makeStrip(i));
   makeContacts();
   sol=solveExact();
   // We want a genuinely non-trivial optimum: 2–4 forced partial peels.
 }while((!sol||sol.partial<2||sol.partial>4) && attempt<55);
 optimal=sol?sol.taps:N;optimalPartial=sol?sol.partial:0;
 createVisuals();fitWorld();render();
 status.innerHTML=`<b>${N} tapes · minimum ${optimal} taps</b><br>Optimal route requires ${optimalPartial} partial peel${optimalPartial===1?'':'s'}.`;
}

viewport.addEventListener('pointerdown',e=>{
 if(animating)return;e.preventDefault();viewport.setPointerCapture?.(e.pointerId);pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 const wp=screenToWorld(e.clientX,e.clientY);
 if(pointers.size===1){tapCandidate={id:e.pointerId,startX:e.clientX,startY:e.clientY,world:wp,moved:false};gesture={type:'pan',startX:e.clientX,startY:e.clientY,startTx:view.tx,startTy:view.ty}}
 else if(pointers.size===2){tapCandidate=null;const ps=[...pointers.values()],dx=ps[1].x-ps[0].x,dy=ps[1].y-ps[0].y,d=hypot(dx,dy),cx=(ps[0].x+ps[1].x)/2,cy=(ps[0].y+ps[1].y)/2;
 gesture={type:'pinch',startDist:d,startScale:view.scale,cx,cy,worldCenter:screenToWorld(cx,cy)}}
},{passive:false});
viewport.addEventListener('pointermove',e=>{
 if(!pointers.has(e.pointerId)||animating)return;e.preventDefault();pointers.set(e.pointerId,{x:e.clientX,y:e.clientY});
 if(tapCandidate&&e.pointerId===tapCandidate.id&&hypot(e.clientX-tapCandidate.startX,e.clientY-tapCandidate.startY)>8)tapCandidate.moved=true;
 if(pointers.size===1&&gesture?.type==='pan'&&tapCandidate?.moved){const p=[...pointers.values()][0];view.tx=gesture.startTx+p.x-gesture.startX;view.ty=gesture.startTy+p.y-gesture.startY;applyView()}
 else if(pointers.size===2){tapCandidate=null;const ps=[...pointers.values()],dx=ps[1].x-ps[0].x,dy=ps[1].y-ps[0].y,d=hypot(dx,dy);
 if(gesture?.type!=='pinch'){const cx=(ps[0].x+ps[1].x)/2,cy=(ps[0].y+ps[1].y)/2;gesture={type:'pinch',startDist:d,startScale:view.scale,cx,cy,worldCenter:screenToWorld(cx,cy)}}
 const ns=clamp(gesture.startScale*(d/gesture.startDist),.26,2.5),r=viewport.getBoundingClientRect(),lx=gesture.cx-r.left,ly=gesture.cy-r.top;
 view.scale=ns;view.tx=lx-gesture.worldCenter.x*ns;view.ty=ly-gesture.worldCenter.y*ns;applyView()}
},{passive:false});
async function endPointer(e){
 if(!pointers.has(e.pointerId))return;const cand=tapCandidate&&tapCandidate.id===e.pointerId?{...tapCandidate}:null;pointers.delete(e.pointerId);
 if(cand&&!cand.moved&&pointers.size===0&&!animating){const target=pickTape(cand.world);if(target)await tapPeel(target)}
 if(pointers.size===1){const p=[...pointers.values()][0];gesture={type:'pan',startX:p.x,startY:p.y,startTx:view.tx,startTy:view.ty}}else if(!pointers.size)gesture=null;
 tapCandidate=null
}
viewport.addEventListener('pointerup',endPointer);viewport.addEventListener('pointercancel',endPointer);
viewport.addEventListener('wheel',e=>{e.preventDefault();const r=viewport.getBoundingClientRect(),lx=e.clientX-r.left,ly=e.clientY-r.top,bx=(lx-view.tx)/view.scale,by=(ly-view.ty)/view.scale,ns=clamp(view.scale*(e.deltaY<0?1.1:.9),.26,2.5);
 view.scale=ns;view.tx=lx-bx*ns;view.ty=ly-by*ns;applyView()},{passive:false});

undoBtn.addEventListener('click',()=>{if(!history.length||animating)return;const h=history.pop();h.state.forEach((x,i)=>Object.assign(strips[i],x));tapCount=h.tapCount;finish.classList.remove('show');render()});
newBtn.addEventListener('click',build);againBtn.addEventListener('click',build);window.addEventListener('resize',fitWorld);
requestAnimationFrame(build);
})();
