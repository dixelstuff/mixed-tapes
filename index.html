<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>ROSTERED</title>
<style>*{box-sizing:border-box}body{margin:0;background:#101013;color:#f5f5f7;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial}.app{max-width:480px;margin:auto;padding:calc(14px + env(safe-area-inset-top)) 14px 28px}h1{margin:0;font-size:30px}.ed{color:#ed4d70}.meta{font-size:11px;color:#999;margin:2px 0 10px}.nav{display:flex;gap:6px}.nav button{flex:1;padding:8px;border-radius:9px;border:1px solid #37373e;background:#222228;color:#aaa;font-weight:800}.nav .on{border-color:#ed4d70;color:#fff}.staff{padding:8px 10px;margin:6px 0;background:#1d1d22;border:1px solid #34343b;border-radius:11px}.staff.on{border-color:#ed4d70;box-shadow:inset 0 0 0 1px #ed4d70}.top{display:flex;justify-content:space-between}.nm{font-size:13px;font-weight:800}.dots,.av,.ct{font-size:10px;color:#999}.pref{font-size:12px;margin-top:3px}.ct{float:right}.grid,.ncrow{display:grid;grid-template-columns:42px 1fr 1fr;gap:5px;align-items:center}.grid{margin-top:11px}.head,.day{text-align:center;font-size:10px;color:#999}.slot,.nc{min-height:39px;border:1px solid #393940;background:#242429;color:#fff;border-radius:9px;font-weight:700}.ncrow{margin-top:6px}.actions{display:grid;grid-template-columns:1fr 1.5fr;gap:7px;margin-top:11px}.act{padding:11px;border:0;border-radius:10px;font-weight:900}.clear{background:#2d2d33;color:#ddd}.check{background:#ed4d70;color:#fff}.box{display:none;margin-top:9px;padding:10px;background:#1d1d22;border-radius:10px;font-size:12px;line-height:1.5}.reveal{width:100%;margin-top:8px;padding:9px;background:none;border:1px solid #393940;color:#999;border-radius:9px;font-size:10px;font-weight:800}button{touch-action:manipulation}</style>
<div class="app"><h1>ROSTER<span class="ed">ED</span></h1><div id="meta" class="meta"></div><div id="nav" class="nav"></div><div id="staff"></div><div id="grid" class="grid"></div><div class="ncrow"><div class="day">NC</div><button class="nc" data-q="0">＋</button><button class="nc" data-q="1">＋</button></div><div class="actions"><button id="clear" class="act clear">CLEAR</button><button id="check" class="act check">CHECK ROSTER</button></div><div id="result" class="box"></div><button id="reveal" class="reveal">SHOW AN OPTIMAL SOLUTION</button><div id="solution" class="box"></div></div>
<script>const LEVELS=[{"title": "LEVEL 1", "w": [3, 2, 2, 2, 2, 1], "pref": ["PM shifts", "Tuesday double shift", "Tuesday AM \u00b7 Thursday PM", "Thursday PM \u00b7 Friday PM", "Tuesday AM \u00b7 Friday AM", "Wednesday PM"], "kind": ["pm", "exact_double", "exact", "exact", "exact", "exact"], "pd": [null, "Tue", [["Tue", "AM"], ["Thu", "PM"]], [["Thu", "PM"], ["Fri", "PM"]], [["Tue", "AM"], ["Fri", "AM"]], [["Wed", "PM"]]], "nc": [4, 2, 3, 3, 4, 1], "a": [["Mon", "Tue", "Thu", "Fri"], ["Mon", "Tue", "Wed", "Thu"], ["Mon", "Tue", "Thu", "Fri"], ["Mon", "Wed", "Thu", "Fri"], ["Mon", "Tue", "Wed", "Fri"], ["Tue", "Wed", "Thu", "Fri"]], "best": 83.33333333333333, "opts": ["Anna|Anna|Bruno|Bruno|Mark|Eli|Lucy|Lucy|Sara|Mark;0,4", "Bruno|Anna|Lucy|Anna|Bruno|Eli|Lucy|Mark|Sara|Mark;0,4", "Bruno|Anna|Lucy|Anna|Bruno|Eli|Mark|Lucy|Sara|Mark;0,4", "Bruno|Anna|Lucy|Anna|Mark|Eli|Bruno|Lucy|Sara|Mark;0,4", "Lucy|Anna|Bruno|Bruno|Mark|Eli|Anna|Lucy|Sara|Mark;0,4", "Lucy|Anna|Bruno|Bruno|Mark|Eli|Lucy|Anna|Sara|Mark;0,4", "Lucy|Anna|Bruno|Bruno|Mark|Eli|Lucy|Mark|Sara|Anna;0,4", "Lucy|Anna|Bruno|Bruno|Mark|Eli|Mark|Lucy|Sara|Anna;0,4", "Lucy|Anna|Lucy|Anna|Bruno|Eli|Bruno|Mark|Sara|Mark;0,4", "Mark|Anna|Bruno|Bruno|Mark|Eli|Lucy|Lucy|Sara|Anna;0,4", "Mark|Anna|Lucy|Anna|Bruno|Eli|Bruno|Lucy|Sara|Mark;0,4"], "top": 8}, {"title": "LEVEL 2", "w": [3, 3, 2, 2, 1, 1], "pref": ["one double shift", "separate days", "PM shifts", "Monday AM \u00b7 Thursday PM", "Friday AM", "Wednesday PM"], "kind": ["double", "separate", "pm", "exact", "exact", "exact"], "pd": [null, null, null, [["Mon", "AM"], ["Thu", "PM"]], [["Fri", "AM"]], [["Wed", "PM"]]], "nc": [3, 4, 2, 5, 3, 2], "a": [["Mon", "Tue", "Wed", "Thu"], ["Mon", "Tue", "Thu", "Fri"], ["Tue", "Wed", "Thu", "Fri"], ["Mon", "Tue", "Thu", "Fri"], ["Mon", "Wed", "Thu", "Fri"], ["Tue", "Wed", "Thu", "Fri"]], "best": 100.0, "opts": ["Anna|Anna|Bruno|Lucy|Anna|Eli|Bruno|Mark|Sara|Lucy;1,3", "Mark|Bruno|Anna|Anna|Anna|Eli|Bruno|Lucy|Sara|Lucy;1,3", "Mark|Bruno|Bruno|Lucy|Anna|Eli|Anna|Anna|Sara|Lucy;1,3"], "top": 9}, {"title": "LEVEL 3", "w": [4, 2, 2, 2, 1, 1], "pref": ["separate days", "Thursday double shift", "AM shifts", "Tuesday PM \u00b7 Friday PM", "Monday AM", "Wednesday PM"], "kind": ["separate", "exact_double", "am", "exact", "exact", "exact"], "pd": [null, "Thu", null, [["Tue", "PM"], ["Fri", "PM"]], [["Mon", "AM"]], [["Wed", "PM"]]], "nc": [2, 4, 3, 3, 5, 2], "a": [["Mon", "Tue", "Wed", "Thu", "Fri"], ["Mon", "Tue", "Thu", "Fri"], ["Mon", "Tue", "Wed", "Fri"], ["Tue", "Wed", "Thu", "Fri"], ["Mon", "Tue", "Thu", "Fri"], ["Mon", "Wed", "Thu", "Fri"]], "best": 94.73684210526316, "opts": ["Lucy|Anna|Anna|Mark|Anna|Eli|Anna|Bruno|Lucy|Mark;1,4", "Lucy|Anna|Anna|Mark|Anna|Eli|Bruno|Anna|Lucy|Mark;1,4", "Lucy|Anna|Anna|Mark|Lucy|Eli|Anna|Bruno|Anna|Mark;1,4", "Lucy|Anna|Anna|Mark|Lucy|Eli|Bruno|Anna|Anna|Mark;1,4", "Lucy|Anna|Lucy|Mark|Anna|Eli|Anna|Bruno|Anna|Mark;1,4", "Lucy|Anna|Lucy|Mark|Anna|Eli|Bruno|Anna|Anna|Mark;1,4", "Lucy|Anna|Anna|Mark|Anna|Eli|Bruno|Bruno|Anna|Mark;2,4", "Lucy|Anna|Anna|Mark|Anna|Eli|Bruno|Bruno|Lucy|Anna;3,4", "Lucy|Anna|Lucy|Anna|Anna|Eli|Bruno|Bruno|Anna|Mark;3,4"], "top": 9}],N=["Anna", "Bruno", "Lucy", "Mark", "Sara", "Eli"],DAYS=["Mon", "Tue", "Wed", "Thu", "Fri"];let li=0,sel=0,R=Array(10).fill(null),NC=[null,null];const $=x=>document.getElementById(x),L=()=>LEVELS[li],cnt=i=>R.filter(x=>x===i).length+NC.filter(x=>x===i).length;
function reset(){sel=0;R=Array(10).fill(null);NC=[null,null];$("result").style.display=$("solution").style.display="none";render()}
function render(){$("meta").textContent=L().title+" · TARGET "+L().best.toFixed(1)+"%";$("nav").innerHTML=LEVELS.map((x,i)=>`<button class="${i===li?'on':''}" data-i="${i}">${i+1}</button>`).join("");$("nav").querySelectorAll("button").forEach(b=>b.onclick=()=>{li=+b.dataset.i;reset()});
$("staff").innerHTML=N.map((n,i)=>`<div class="staff ${sel===i?'on':''}" data-i="${i}"><div class="top"><span class="nm">${n} · ${L().w[i]} session${L().w[i]==1?'':'s'}</span><span class="dots">NC ${'●'.repeat(L().nc[i])}${'○'.repeat(5-L().nc[i])}</span></div><div class="pref">Prefers: ${L().pref[i]}</div><div class="av">Available: ${L().a[i].join(' · ')}<span class="ct">${cnt(i)}/${L().w[i]}</span></div></div>`).join("");$("staff").querySelectorAll(".staff").forEach(x=>x.onclick=()=>{sel=+x.dataset.i;render()});
$("grid").innerHTML='<div></div><div class="head">AM</div><div class="head">PM</div>';DAYS.forEach((d,di)=>{$("grid").insertAdjacentHTML("beforeend",`<div class="day">${d.toUpperCase()}</div>`);for(let p=0;p<2;p++){let k=di*2+p;$("grid").insertAdjacentHTML("beforeend",`<button class="slot" data-k="${k}">${R[k]==null?'＋':N[R[k]]}</button>`)}});$("grid").querySelectorAll(".slot").forEach(b=>b.onclick=()=>{let k=+b.dataset.k,d=DAYS[Math.floor(k/2)];if(R[k]!=null)R[k]=null;else if(cnt(sel)<L().w[sel]&&L().a[sel].includes(d))R[k]=sel;render()});
document.querySelectorAll(".nc").forEach(b=>{let q=+b.dataset.q;b.textContent=NC[q]==null?'＋':N[NC[q]];b.onclick=()=>{if(NC[q]!=null)NC[q]=null;else if(cnt(sel)<L().w[sel]&&!NC.includes(sel))NC[q]=sel;render()}})}
function pref(i,A){let k=L().kind[i],d=L().pd[i],n=A.length,S=new Set(A),s=0,den=0;if(k=="pm"){den=n;s=A.filter(x=>x%2).length}else if(k=="am"){den=n;s=A.filter(x=>x%2==0).length}else if(k=="exact"){let e=d.map(x=>DAYS.indexOf(x[0])*2+(x[1]=="PM"));den=Math.min(e.length,n);s=e.filter(x=>S.has(x)).length}else if(k=="double"){den=Math.min(2,n);s=DAYS.some((_,j)=>S.has(j*2)&&S.has(j*2+1))?2:0}else if(k=="exact_double"){den=Math.min(2,n);let j=DAYS.indexOf(d);s=S.has(j*2)&&S.has(j*2+1)?2:0}else if(k=="separate"){den=n;s=n;for(let j=0;j<5;j++)if(S.has(j*2)&&S.has(j*2+1))s-=2}return[s,den]}
function sig(){return R.map(x=>N[x]).join("|")+";"+NC.slice().sort((a,b)=>a-b).join(",")}
$("check").onclick=()=>{let z=$("result");z.style.display="block";if(R.some(x=>x==null)||NC.some(x=>x==null)){z.innerHTML="<b>Roster incomplete.</b> Fill all shifts and both NC spots.";return}for(let i=0;i<6;i++)if(cnt(i)!=L().w[i]){z.innerHTML=`<b>Workload mismatch.</b> ${N[i]} has ${cnt(i)}/${L().w[i]} sessions.`;return}let s=0,d=0,lines=[];for(let i=0;i<6;i++){let A=[];R.forEach((x,k)=>{if(x===i)A.push(k)});let q=pref(i,A);s+=q[0];d+=q[1];lines.push(`${N[i]} ${q[0]}/${q[1]}`)}let bonus=NC.reduce((a,i)=>a+L().nc[i],0),pct=100*(s+bonus)/(d+L().top),ok=L().opts.includes(sig());z.innerHTML=`<b>HAPPINESS ${pct.toFixed(1)}%</b> · target ${L().best.toFixed(1)}%<br>${lines.join(" · ")}<br>NC bonus +${bonus}`+(ok?"<br><b>OPTIMAL ROSTER ✓</b>":"")}
$("clear").onclick=reset;$("reveal").onclick=()=>{let [rr,nn]=L().opts[0].split(";"),a=rr.split("|"),ni=nn.split(",").map(Number),z=$("solution");z.style.display="block";z.innerHTML="<b>AN OPTIMAL SOLUTION</b><br>"+DAYS.map((d,i)=>`${d}: ${a[i*2]} AM · ${a[i*2+1]} PM`).join("<br>")+`<br>NC: ${N[ni[0]]} · ${N[ni[1]]}`};render();</script>
