<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Growing Paint — Bauhaus Portrait Layout</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#d8d3c9;font-family:"Arial Narrow","Helvetica Neue",Arial,sans-serif}
#app{height:100%;display:flex;flex-direction:column;background:#f4eee2;color:#111}
#hud{
  flex:0 0 132px;
  display:grid;
  grid-template-columns:1.35fr .82fr .72fr;
  align-items:end;
  gap:20px;
  padding:22px 28px 18px;
  background:#f4eee2;
}
.metric{min-width:0}
.label{
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;
  font-weight:800;color:#222;margin-bottom:5px
}
.value{
  font-size:32px;line-height:.95;font-weight:900;letter-spacing:-.02em;
  font-variant-numeric:tabular-nums
}
#level .value{font-size:36px;letter-spacing:.015em;color:#111}
#level .label{
  font-size:11px;letter-spacing:.18em;color:#e45437;
  margin-top:8px;margin-bottom:0
}
#wrap{
  position:relative;
  flex:1 1 auto;
  overflow:hidden;
  background:#f4eee2;
  touch-action:none;
}
#paint{position:absolute;inset:0;width:100%;height:100%;display:block}
#vector{position:absolute;pointer-events:none}
#vector svg{display:block;width:100%;height:100%;overflow:visible}

/* reserve the button zone even before the level is finished */
#footer{
  flex:0 0 86px;
  display:flex;align-items:center;justify-content:center;
  background:#f4eee2;
  visibility:hidden;
}
#footer.show{visibility:visible}
#retry{
  min-width:230px;border:0;border-radius:8px;background:#111;color:#fff;
  padding:14px 26px;font-size:15px;font-weight:900;
  letter-spacing:.13em;text-transform:uppercase
}

/* small permanent footer reserve for future navigation / branding */
#futureFooter{
  flex:0 0 26px;
  background:#f4eee2;
}

@media(max-width:560px){
  #hud{
    flex-basis:122px;
    padding:18px 16px 16px;
    gap:10px;
    grid-template-columns:1.28fr .82fr .70fr;
  }
  .label{font-size:9px}
  .value{font-size:25px}
  #level .value{font-size:29px}
  #level .label{font-size:9px}
  #footer{flex-basis:80px}
  #futureFooter{flex-basis:20px}
}
  .label{font-size:9px}.value{font-size:25px}
  #level .value{font-size:26px}#level .label{font-size:9px}
}
</style>
</head>
<body>
<div id="app">
  <div id="hud">
    <div class="metric" id="level">
      <div class="value">LEVEL 37</div>
      <div class="label sublevel">FIVE ZONES</div>
    </div>
    <div class="metric">
      <div class="label" id="accuracyLabel">ACCURACY</div>
      <div class="value" id="accuracy">100.0%</div>
    </div>
    <div class="metric">
      <div class="label">TARGET</div>
      <div class="value">96%</div>
    </div>
  </div>

  <div id="wrap">
    <canvas id="paint"></canvas>
    <div id="vector">
      <svg viewBox="0 125 900 1015" preserveAspectRatio="none" aria-hidden="true">

        <!-- Interior dividers are split into real path segments.
             There is NO mask and therefore no residual white nib at any gate. -->
        <g fill="none" stroke="#fff" stroke-width="10"
           stroke-linecap="butt" stroke-linejoin="miter">

          <path d="M330.00 160.00 C366.19 211.70 390.35 282.12 394.89 356.04"/>
          <path d="M395.63 386.02 C394.92 445.67 381.01 506.25 330.00 625.00"/>

          <path d="M582.94 495.02 C553.75 514.82 510.00 548.00 445.00 620.00"/>

          <path d="M410 670 L515 730 L690 820 V900 H760 V970"/>
          <path d="M760 1008 V1080"/>

          <path d="M356.53 892.16 L335 940 L260 920 L220 1080"/>

          <path d="M210.80 707.53 C246.28 693.63 278.99 674.80 330.00 635.00"/>
        </g>


        <!-- pure-black prefilled element; drawn after separators so its white
             outline masks divider overshoot and guarantees a seamless junction -->
        <path d="M700 160 H860 V560
                 C834 525 805 500 770 480
                 C730 458 700 438 700 398
                 V160 Z"
              fill="#000"
              stroke="#fff"
              stroke-width="12"

        <!-- pure-white non-fillable centre -->
        <circle cx="430" cy="650" r="120" fill="#fff"/>

        <!-- white outer frame, per requested visual system -->
        <rect x="40" y="160" width="820" height="920" fill="none" stroke="#fff" stroke-width="10"/>
      </svg>
    </div>
  </div>

  <div id="footer">
    <button id="retry">RETRY LEVEL</button>
  </div>
  <div id="futureFooter"></div>
</div>

function loadImage(src){return new Promise((ok,no)=>{const i=new Image;i.onload=()=>ok(i);i.onerror=no;i.src=src})}

async function loadRegion(){
  const img=await loadImage(REGION);
  const c=document.createElement('canvas');
  c.width=MW;c.height=MH;
  const x=c.getContext('2d',{willReadFrequently:true});

  }

function transitionAllowed(a,b,x,y){
  if(a===b)return true;
  if(!a||!b)return false;

  const wx=x*WORLD_W/MW,wy=y*WORLD_H/MH;

  for(const g of GAPS){
    if(!((g.a===a&&g.b===b)||(g.a===b&&g.b===a)))continue;

    const rad=-g.angle*Math.PI/180;
    const dx=wx-g.x,dy=wy-g.y;
    const lx=dx*Math.cos(rad)-dy*Math.sin(rad);
    const ly=dx*Math.sin(rad)+dy*Math.cos(rad);

    // Small tolerance so the physical opening matches the visible slot cleanly.
    if(Math.abs(lx)<=g.w/2+2 && Math.abs(ly)<=g.h/2+2)return true;
  }
  return false;
}

function clearSegment(x0,y0,x1,y1){
  const dx=x1-x0,dy=y1-y0,n=Math.max(Math.abs(dx),Math.abs(dy));
  let px=x0,py=y0,pr=intended[y0*MW+x0];
  if(!pr)return false;
  for(let q=1;q<=n;q++){
    const x=Math.round(x0+dx*q/n),y=Math.round(y0+dy*q/n);
    if(x<0||y<0||x>=MW||y>=MH)return false;
    const r=intended[y*MW+x];
    if(!r)return false;
    if(r!==pr && !transitionAllowed(pr,r,(px+x)/2,(py+y)/2))return false;
    px=x;py=y;pr=r;
  }
  return true;
}

// OG rounded propagation
function heapPush(v){
  let i=heap.length;heap.push(v);
  while(i){const p=(i-1)>>1;if(heap[p].t<=v.t)break;heap[i]=heap[p];i=p}
  heap[i]=v;
}
function heapPop(){
  const first=heap[0],last=heap.pop();
  if(heap.length){
    let i=0;
    for(;;){
      const l=i*2+1,r=l+1;if(l>=heap.length)break;
      let c=r<heap.length&&heap[r].t<heap[l].t?r:l;
      if(heap[c].t>=last.t)break;
      heap[i]=heap[c];i=c;
    }
    heap[i]=last;
  }
  return first;
}
const dirs=[],seen=new Set();
function gcd(a,b){while(b){const t=a%b;a=b;b=t}return Math.abs(a)||1}
for(let dy=-4;dy<=4;dy++)for(let dx=-4;dx<=4;dx++){
  if(!dx&&!dy)continue;
  const g=gcd(Math.abs(dx),Math.abs(dy)),k=(dx/g)+','+(dy/g);
  if(seen.has(k))continue;
  seen.add(k);dirs.push([dx,dy,Math.hypot(dx,dy)]);
}
const SPEED=15;
function best(src,i){return src.best.get(i)??Infinity}
function schedule(i,sid,t){
  const src=sources[sid],x=i%MW,y=(i/MW)|0;
  for(const [dx,dy,cost] of dirs){
    const nx=x+dx,ny=y+dy;
    if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
    const ni=ny*MW+nx;
    if(!intended[ni])continue;
    if(owner[ni]!==-1&&owner[ni]!==sid)continue;
    if(!clearSegment(x,y,nx,ny))continue;
    const nt=t+cost/SPEED;
    if(nt+1e-6<best(src,ni)){
      src.best.set(ni,nt);
      heapPush({i:ni,sid,t:nt});
    }
  }
}
function hex(h){return [parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)]}

  let y=Math.max(0,Math.min(MH-1,Math.floor(my)));
  let i=y*MW+x,id=intended[i];

  if(!id){
    let bestI=-1,bestD=1e9;
    for(let r=1;r<=18;r++){
      for(let yy=-r;yy<=r;yy++)for(let xx=-r;xx<=r;xx++){
        if(Math.max(Math.abs(xx),Math.abs(yy))!==r)continue;
        const nx=x+xx,ny=y+yy;
        if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
        const ni=ny*MW+nx;
        if(!intended[ni])continue;
        const d=xx*xx+yy*yy;
        if(d<bestD){bestD=d;bestI=ni}
      }
      if(bestI>=0){i=bestI;id=intended[i];break}
    }
  }

  if(!id||started[id]||owner[i]!==-1)return;

  started[id]=1;
  const sid=sources.length,now=performance.now()/1000-clock0;
  const src={id,rgb:hex(COLORS[id]),best:new Map([[i,now]])};
  sources.push(src);
  heapPush({i,sid,t:now});
}

function advance(now){
  let count=0;
  while(heap.length&&heap[0].t<=now&&count++<15000){
    const e=heapPop(),src=sources[e.sid];
    if(!src||Math.abs(best(src,e.i)-e.t)>.0001)continue;
    if(owner[e.i]!==-1){
      if(owner[e.i]!==e.sid)continue;
    }else{
      owner[e.i]=e.sid;
      const c=src.rgb,j=e.i*4;
      simImage.data[j]=c[0];
      simImage.data[j+1]=c[1];
      simImage.data[j+2]=c[2];
      simImage.data[j+3]=255;
    }
    schedule(e.i,e.sid,e.t);
  }
}

function updateAccuracy(){
  let filled=0,correct=0;
  for(let i=0;i<intended.length;i++){
    if(!intended[i])continue;
    const sid=owner[i];
    if(sid<0)continue;
    filled++;
    if(sources[sid].id===intended[i])correct++;
  }
  const a=filled?100*correct/filled:100;
  accEl.textContent=a.toFixed(1)+'%';
  return a;
}

function initSim(){
  owner=new Int16Array(MW*MH);owner.fill(-1);
  started=new Uint8Array(6);
  sources=[];heap=[];finished=false;
  clock0=performance.now()/1000;

  simCanvas=document.createElement('canvas');
  simCanvas.width=MW;simCanvas.height=MH;
  sctx=simCanvas.getContext('2d');
  simImage=sctx.createImageData(MW,MH);

  for(let i=0;i<MW*MH;i++){
    const j=i*4;
    if(intended[i]){
      simImage.data[j]=PLAY[0];
      simImage.data[j+1]=PLAY[1];
      simImage.data[j+2]=PLAY[2];
    }else{
      simImage.data[j]=PAGE[0];
      simImage.data[j+1]=PAGE[1];
      simImage.data[j+2]=PAGE[2];
    }
    simImage.data[j+3]=255;
  }

  sctx.putImageData(simImage,0,0);
  accEl.textContent='100.0%';
  accLabel.textContent='ACCURACY';
  footer.classList.remove('show');
}

function resize(){
  const r=wrap.getBoundingClientRect();
  const dpr=Math.min(2,devicePixelRatio||1);

  displayW=Math.round(r.width*dpr);
  displayH=Math.round(r.height*dpr);
  paint.width=displayW;
  paint.height=displayH;

  // Portrait composition: scale primarily from width, then clamp to available
  // height. The play board is deliberately top-biased instead of vertically
  // centred, leaving breathing room below for the result button/footer.
  const sidePad=22*dpr;
  const topPad=8*dpr;
  const maxW=displayW-sidePad*2;
  const maxH=displayH-topPad-8*dpr;
  const scale=Math.min(maxW/WORLD_W, maxH/VIEW_H);

  DW=WORLD_W*scale;
  DH=VIEW_H*scale;
  DX=(displayW-DW)/2;
  DY=topPad;

  vector.style.left=(DX/dpr)+'px';
  vector.style.top=(DY/dpr)+'px';
  vector.style.width=(DW/dpr)+'px';
  vector.style.height=(DH/dpr)+'px';

  renderPaint();
}

function renderPaint(){
  sctx.putImageData(simImage,0,0);

  ctx.fillStyle=`rgb(${PAGE.join(',')})`;
  ctx.fillRect(0,0,displayW,displayH);

  ctx.imageSmoothingEnabled=true;
  ctx.imageSmoothingQuality='high';

  const srcY=VIEW_Y/WORLD_H*MH;
  const srcH=VIEW_H/WORLD_H*MH;
  ctx.drawImage(
    simCanvas,
    0,srcY,MW,srcH,
    DX,DY,DW,DH
  );
}

function finishLevel(){
  if(finished)return;
  finished=true;
  renderPaint();
  const a=updateAccuracy();
  accLabel.textContent=a>=TARGET?'PASSED':'RESULT';
  footer.classList.add('show');
}

function loop(ms){
  if(!finished){
    advance(ms/1000-clock0);
    if(ms-lastPaint>32){lastPaint=ms;renderPaint()}
    if(ms-lastStats>100){lastStats=ms;updateAccuracy()}

    let all=true;
    for(let id=1;id<=5;id++)if(!started[id]){all=false;break}
    if(all&&heap.length===0)finishLevel();
  }
  raf=requestAnimationFrame(loop);
}

function reset(){
  initSim();
  resize();
}

wrap.addEventListener('pointerdown',e=>{
  if(finished)return;
  e.preventDefault();
  const r=wrap.getBoundingClientRect(),dpr=displayW/r.width;
  const px=(e.clientX-r.left)*dpr,py=(e.clientY-r.top)*dpr;
  if(px<DX||px>=DX+DW||py<DY||py>=DY+DH)return;
  const mx=(px-DX)/DW*MW;
  const worldY=VIEW_Y + ((py-DY)/DH)*VIEW_H;
  const my=worldY/WORLD_H*MH;
  startFill(mx,my);
},{passive:false});

retry.onclick=reset;
window.addEventListener('resize',resize);

loadRegion().then(()=>{
  initSim();
  resize();
  raf=requestAnimationFrame(loop);
}).catch(console.error);
})();
</script>
</body>
</html>
